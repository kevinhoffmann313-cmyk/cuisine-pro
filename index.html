:root{--green:#173b32;--green2:#245849;--cream:#f5f4ee;--paper:#fff;--ink:#17221f;--muted:#6b7772;--line:#dce3dd;--red:#a33232;--amber:#92620b;--shadow:0 8px 28px #18382b0c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;min-height:100vh}.top{background:var(--green);color:white;padding:20px clamp(16px,4vw,36px) 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border:1px solid #ffffff55;border-radius:13px;display:grid;place-items:center;font-size:23px}.brand h1{font-size:21px;margin:0;letter-spacing:-.5px}.brand p{margin:2px 0 0;color:#c5d8d0;font-size:12px}.status{font-size:12px;background:#ffffff17;border:1px solid #ffffff30;border-radius:999px;padding:7px 10px;white-space:nowrap}.layout{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:24px clamp(14px,3vw,32px)}nav{display:flex;flex-direction:column;gap:5px}nav button{background:transparent;border:0;text-align:left;border-radius:10px;padding:12px 13px;color:#52605a;display:flex;align-items:center;gap:10px}nav button.active,nav button:hover{background:#e2e9e2;color:var(--green);font-weight:650}.nav-icon{width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.nav-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav-foot{margin-top:auto;padding:16px 10px;color:var(--muted);font-size:12px}.content{min-width:0}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:0 0 20px}.page-head h2{font-size:26px;letter-spacing:-.7px;margin:0}.page-head p{color:var(--muted);margin:5px 0 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:9px 13px;font-weight:600}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.danger{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow);min-width:0}.metric{font-size:28px;font-weight:750;letter-spacing:-1px;margin:10px 0 1px}.muted{color:var(--muted);font-size:13px}.card-title{font-weight:700;margin:0 0 12px}.section{margin-top:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 11px}.section-head h3{font-size:17px;margin:0}.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.quick button{border:1px solid var(--line);background:white;border-radius:13px;padding:16px;text-align:left;color:var(--ink)}.quick button span{font-size:22px;display:block;margin-bottom:8px}.quick strong{display:block}.quick small{color:var(--muted)}.list{display:flex;flex-direction:column}.list-row{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.list-row:last-child{border-bottom:0}.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:4px 8px;background:#e7eee8;color:var(--green)}.pill.warn{background:#fff0ce;color:#80550a}.pill.bad{background:#f9e3e1;color:#8e2828}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#53615a}.field input,.field select,.field textarea,.search{width:100%;padding:10px 11px;border:1px solid #cfd8d1;border-radius:8px;background:white;color:var(--ink);min-width:0}.field textarea{min-height:84px;resize:vertical}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.table-wrap{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:12px}.data-table{border-collapse:collapse;width:100%;min-width:590px}.data-table th,.data-table td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.data-table th{background:#f7f8f5;color:#5e6b64;font-size:11px;text-transform:uppercase;letter-spacing:.4px}.data-table tr:last-child td{border-bottom:0}.empty{padding:26px;text-align:center;color:var(--muted)}.recipe-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.recipe{background:white;border:1px solid var(--line);border-radius:13px;padding:16px}.recipe h3{margin:0 0 4px;font-size:16px}.recipe p{margin:0;color:var(--muted);font-size:12px}.recipe-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}.recipe-actions{display:flex;gap:6px}.small-btn{border:1px solid var(--line);background:white;border-radius:7px;padding:6px 8px;font-size:12px}.notice{background:#edf3ed;border:1px solid #d5e2d6;border-radius:11px;padding:13px 15px;color:#315044;font-size:13px;margin-bottom:16px}.notice.warn{background:#fff5df;border-color:#ecd9a9;color:#76500b}.hidden{display:none!important}.footer{padding:22px 4px;color:var(--muted);font-size:11px}.checkline{display:flex;align-items:center;gap:9px}.checkline input{width:18px;height:18px}.overlay{position:fixed;inset:0;background:#101b17a8;display:grid;place-items:center;padding:16px;z-index:5}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--cream);border-radius:17px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.xbtn{border:0;background:transparent;font-size:24px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172d27;color:white;padding:12px 17px;border-radius:10px;z-index:10;box-shadow:var(--shadow);max-width:90vw}.subnav{display:none}.photo-list{display:flex;flex-wrap:wrap;gap:8px}.photo-item{width:130px}.photo-item img{width:100%;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.photo-item small{display:block;overflow-wrap:anywhere;color:var(--muted);font-size:11px}.photo-thumb{width:54px;height:54px;object-fit:cover;border-radius:7px;border:1px solid var(--line);margin:4px}
@media(max-width:760px){.layout{display:block;padding:16px 13px 92px}.top{padding:16px}.brand h1{font-size:18px}.status{font-size:10px}.layout nav{position:fixed;z-index:4;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));display:flex;flex-direction:row;justify-content:space-around;gap:2px}.layout nav button{flex:1;flex-direction:column;gap:3px;text-align:center;padding:7px 2px;font-size:10px;border-radius:8px}.nav-icon{font-size:17px}.nav-foot{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:13px}.metric{font-size:24px}.quick{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick button{padding:12px}.page-head{flex-direction:column}.page-head h2{font-size:23px}.recipe-grid{grid-template-columns:1fr}.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.form-actions{justify-content:stretch}.form-actions button{flex:1}.section{margin-top:16px}}
 .recipe-ingredient-list{display:block;width:100%;min-width:0;list-style:none;margin:0!important;padding:0!important}.recipe-ingredient-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:3px;padding:0!important;margin:0!important;border:0;width:100%;min-width:0;font-size:10px;line-height:1!important;min-height:0}.recipe-ingredient-name{min-width:0;overflow-wrap:anywhere;white-space:normal;font-size:10px;font-weight:400;line-height:1!important;margin:0;padding:0}.recipe-ingredient-qty{white-space:normal;text-align:right;font-weight:600;font-size:10px;line-height:1!important;max-width:38%;overflow-wrap:anywhere;margin:0;padding:0}@media(max-width:480px){.recipe-ingredient-row{gap:8px;padding:8px 0}.recipe-ingredient-qty{max-width:40%}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">♨</div><div><h1>Cuisine Pro</h1><p>Hygiène · Recettes · Production</p></div></div><div class="status" id="connectionStatus">● Stockage local actif</div></header><div class="layout"><nav id="nav"><button class="active" data-page="home"><span class="nav-icon">⌂</span>Accueil</button><button data-page="hygiene"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3h10v3H7zM6 6h12v15H6z"/><path d="m9 13 2 2 4-4"/></svg></span>Hygiène</button><button data-page="trace"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v5h4M8 12h8M8 16h8M8 8h3"/></svg></span>Traçabilité</button><button data-page="recipes"><span class="nav-icon" aria-hidden="true" style="font-size:20px">👨‍🍳</span>Recettes</button><button data-page="settings"><span class="nav-icon">⚙</span>Données</button><div class="nav-foot">Version 0.2<br>Données enregistrées sur cet appareil.</div></nav><main class="content" id="main"></main></div></div><div id="modalRoot"></div><div id="toastRoot"></div>

<script>
const SUPABASE_URL='https://vezzbekmqxpuoserdoub.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_FHy4QW5z9ILOFRYrp4ky0A_yFLNz21X';
let supabaseClient=null, cloudUser=null, cloudReady=false;
try{if(window.supabase&&window.supabase.createClient)supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY)}catch(e){console.error('Supabase init failed',e)}
const KEY='cuisinePro_v1';
const PHOTO_DB='cuisinePro_photos_v1';
let persistenceError=false;
let loadFailed=false;
function openPhotoDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(PHOTO_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('photos'))req.result.createObjectStore('photos',{keyPath:'id'}).createIndex('lotId','lotId',{unique:false})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function optimizePhoto(file){try{const bitmap=await createImageBitmap(file);const max=2200,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));if(scale===1&&file.size<1200000){bitmap.close();return file}const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return await new Promise(resolve=>canvas.toBlob(blob=>resolve(blob||file),'image/jpeg',0.84))}catch(e){return file}}
async function saveLotPhotos(lotId,files){const valid=files.filter(f=>f&&f.type.startsWith('image/'));if(!valid.length)return Promise.resolve();const records=[];for(const file of valid){records.push({id:uid(),lotId,name:file.name||'photo',blob:await optimizePhoto(file)})}const d=await openPhotoDB();try{await new Promise((resolve,reject)=>{const tx=d.transaction('photos','readwrite'),st=tx.objectStore('photos');records.forEach(p=>st.put(p));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Transaction annulée'))})}finally{d.close()}}
async function showLotPhotos(lotId){const lot=db.lots.find(x=>x.id===lotId);if(!lot)return;openModal('Photos de la réception', '<p class="muted">Chargement…</p>');try{const d=await openPhotoDB();const photos=await new Promise((resolve,reject)=>{const req=d.transaction('photos','readonly').objectStore('photos').index('lotId').getAll(lotId);req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)});d.close();const root=document.querySelector('#modalRoot .modal');if(!root)return;root.innerHTML='<div class="modal-head"><h3>Photos — '+esc(lot.product)+'</h3><button class="xbtn" data-action="close-modal">×</button></div><p class="muted">Réception du '+fmtDate(lot.date)+' · Lot '+esc(lot.batch||'—')+'</p>'+(photos.length?'<div class="photo-list">'+photos.map(p=>'<div class="photo-item"><img src="'+URL.createObjectURL(p.blob)+'" alt="'+esc(p.name)+'"><small>'+esc(p.name)+'</small></div>').join('')+'</div>':'<div class="empty">Aucune photo enregistrée.</div>')+'<div class="form-actions"><button class="btn" data-action="close-modal">Fermer</button></div>'}catch(e){toast('Impossible de lire les photos.')}}

const starter={temps:[],cleaning:[],lots:[],recipes:[{id:'abricots-rotis-miel-romarin',name:'Abricots rôtis au miel et au romarin',category:'Dessert',portions:6,ingredients:[{name:'Abricots',qty:18,unit:'pièce'},{name:'Miel',qty:200,unit:'g'},{name:'Huile d’olive',qty:200,unit:'g'},{name:'Romarin frais',qty:5,unit:'tige'},{name:'Ficelle alimentaire',qty:1,unit:'quantité nécessaire'}],steps:'1. Laver les abricots, les couper en deux et retirer les noyaux. Réserver.\n2. Réunir les 5 tiges de romarin et les attacher avec de la ficelle alimentaire pour former un bouquet.\n3. Dans une grande casserole, faire fondre doucement le miel avec l’huile d’olive jusqu’à obtenir un mélange homogène.\n4. Ajouter le bouquet de romarin pour infuser.\n5. Ajouter les abricots et laisser compoter à feu doux jusqu’à ce qu’ils soient bien tendres, en conservant leur forme autant que possible.\n6. Débarrasser délicatement les abricots sur une plaque et retirer le bouquet de romarin.\n7. Laisser refroidir, puis placer au réfrigérateur pendant au moins 2 heures avant dégustation.',allergens:'Aucun allergène majeur identifié dans la recette de base. Vérifier les accompagnements choisis : spéculoos (gluten), mascarpone ou sorbet au fromage blanc (lait).',notes:'Rendement : 6 personnes. Suggestions d’accompagnement : spéculoos et sorbet au fromage blanc, zeste de citron vert, quenelle de mascarpone aux agrumes ou verveine. Liste de courses associée : 18 abricots, 200 g de miel, 200 g d’huile d’olive, 5 tiges de romarin frais et ficelle alimentaire.',cost:''},{id:'riz-au-lait-22-verrines',name:'Riz au lait',category:'Dessert',portions:22,ingredients:[{name:'Riz',qty:400,unit:'g'},{name:'Lait',qty:1,unit:'L'},{name:'Gousses de vanille',qty:4,unit:'pièce'},{name:'Sucre',qty:360,unit:'g'},{name:'Crème liquide entière à 35 % MG',qty:500,unit:'ml'}],steps:'1. Blanchir le riz : porter une casserole d’eau à ébullition, ajouter le riz et arrêter la cuisson dès la première ébullition. Égoutter.\n2. Remettre le riz dans une casserole sur feu doux et ajouter le lait.\n3. Ouvrir les gousses de vanille, gratter les graines et les ajouter avec les gousses pour infuser.\n4. Ajouter le sucre et cuire à feu doux jusqu’à ce que le riz soit tendre.\n5. Retirer les gousses de vanille et laisser refroidir complètement le riz au lait.\n6. Monter la crème liquide bien froide en crème fouettée souple.\n7. Incorporer délicatement la crème fouettée au riz au lait froid, en plusieurs fois, à l’aide d’une maryse.\n8. Répartir dans 22 verrines et conserver au réfrigérateur jusqu’au service.',allergens:'Lait.',notes:'Rendement : 22 verrines. La crème liquide doit être montée en crème fouettée et incorporée uniquement lorsque le riz au lait est complètement froid. Les ingrédients sont listés pour préparer la liste de courses.',cost:''},{id:'r1',name:'Velouté de saison',category:'Entrée',portions:10,ingredients:[{name:'Légumes de saison',qty:2,unit:'kg'},{name:'Bouillon de légumes',qty:2,unit:'L'},{name:'Crème',qty:0.3,unit:'L'}],steps:'Laver et préparer les légumes. Suer, mouiller au bouillon, cuire puis mixer. Ajouter la crème et rectifier l’assaisonnement.',allergens:'Lait (si crème utilisée)',notes:'Adapter les légumes selon arrivage.',cost:''},{id:'r2',name:'Ganache au chocolat',category:'Dessert',portions:9,ingredients:[{name:'Sucre glace',qty:175,unit:'g'},{name:'Cacao en poudre',qty:125,unit:'g'},{name:'Beurre pommade',qty:205,unit:'g'},{name:'Chocolat noir fondu',qty:100,unit:'g'},{name:'Jaunes d’œufs',qty:80,unit:'g'},{name:'Crème liquide entière à 30 % MG minimum',qty:500,unit:'g'}],steps:'1. Préparer les ingrédients : obtenir un beurre pommade, faire fondre le chocolat noir et le laisser légèrement tiédir. Maintenir la crème liquide bien froide.\n2. Mettre le sucre glace, le cacao en poudre, le beurre pommade et le chocolat noir fondu dans la cuve du Robot-Coupe.\n3. Mixer jusqu’à obtenir une pâte homogène.\n4. Ajouter les jaunes d’œufs et mixer de nouveau jusqu’à homogénéité.\n5. Tout en laissant l’appareil fonctionner, verser progressivement la crème liquide bien froide.\n6. Poursuivre le mixage jusqu’à obtenir une préparation parfaitement lisse, brillante et homogène.\n7. Transférer la ganache dans une poche munie de la douille adaptée.\n8. Pocher la préparation dans 9 moules en silicone.',allergens:'Lait, œufs. Vérifier également les étiquettes du chocolat et du cacao utilisés.',notes:'Rendement : 9 moules en silicone. La crème doit être bien froide et ajoutée progressivement. En restauration, privilégier des jaunes d’œufs pasteurisés et conserver au froid selon le protocole de l’établissement.',cost:''},{id:'brownies-chocolat',name:'Brownies au chocolat',category:'Dessert',portions:10,ingredients:[{name:'Chocolat noir',qty:300,unit:'g'},{name:'Beurre',qty:200,unit:'g'},{name:'Sucre',qty:250,unit:'g'},{name:'Œufs',qty:4,unit:'pièce'},{name:'Farine',qty:120,unit:'g'},{name:'Cacao en poudre non sucré',qty:30,unit:'g'},{name:'Sel',qty:2,unit:'g'}],steps:'1. Préchauffer le four à 170 °C.\n2. Faire fondre doucement le chocolat noir avec le beurre, puis laisser tiédir.\n3. Mélanger les œufs et le sucre sans trop faire mousser.\n4. Incorporer le chocolat fondu. Ajouter la farine, le cacao et le sel tamisés, puis mélanger juste assez pour obtenir une pâte homogène.\n5. Verser dans un moule chemisé de papier cuisson.\n6. Cuire environ 20 à 25 minutes à 170 °C : le centre doit rester légèrement fondant. Adapter le temps à l’épaisseur et au four.\n7. Laisser refroidir avant de détailler en 10 portions.',allergens:'Gluten (farine), œufs, lait (beurre). Vérifier les étiquettes du chocolat et du cacao.',notes:'Pour 10 portions. Pour un cœur plus fondant, surveiller la cuisson en fin de parcours.',cost:''},{id:'brocoli-parmesan-sauce-cacahuete',name:'Brocolis en croûte de parmesan, sauce ricotta et beurre de cacahuètes',category:'Végétarien',portions:4,ingredients:[{name:'Brocolis',qty:2,unit:'pièce'},{name:'Oignon rouge',qty:2,unit:'pièce'},{name:'Chapelure',qty:70,unit:'g'},{name:'Parmesan râpé',qty:70,unit:'g'},{name:'Huile d’olive',qty:10,unit:'c. à café'},{name:'Persillade',qty:2,unit:'c. à soupe'},{name:'Sirop d’érable',qty:4,unit:'c. à soupe'},{name:'Sauce soja salée',qty:4,unit:'c. à soupe'},{name:'Ricotta',qty:200,unit:'g'},{name:'Yaourt grec',qty:4,unit:'c. à soupe'},{name:'Beurre de cacahuètes',qty:2,unit:'c. à soupe'},{name:'Sauce soja (pour la sauce)',qty:2,unit:'c. à soupe'},{name:'Miel',qty:2,unit:'c. à soupe'},{name:'Vinaigre blanc',qty:2,unit:'c. à soupe'},{name:'Eau',qty:1,unit:'fond à ajuster'},{name:'Sel et poivre',qty:1,unit:'à ajuster'}],steps:'1. Préchauffer le four à 190 °C.\n2. Rincer les brocolis et couper les têtes en morceaux. Émincer finement les oignons rouges.\n3. Dans un grand saladier, mélanger la chapelure, le parmesan râpé, l’huile d’olive, la persillade, le sirop d’érable et la sauce soja. Ajouter les brocolis et les oignons, puis bien mélanger pour les enrober.\n4. Répartir sur une plaque et cuire 20 à 25 minutes à 190 °C, jusqu’à ce que les brocolis soient tendres et la croûte dorée.\n5. Pour la sauce, mélanger la ricotta, le yaourt grec, le beurre de cacahuètes, la sauce soja, le miel et le vinaigre blanc. Ajouter progressivement un peu d’eau jusqu’à obtenir la texture souhaitée. Saler et poivrer.\n6. Servir les brocolis chauds avec la sauce ricotta-cacahuètes.',allergens:'Lait (parmesan, ricotta, yaourt grec), arachides (beurre de cacahuètes), soja (sauce soja), gluten possible (chapelure et sauce soja). Vérifier les étiquettes.',notes:'Quantités prévues pour 4 personnes. Cuisson au four à 190 °C pendant 20 à 25 minutes.',cost:''},{id:'tarte-pommes-croustillantes-raisins',name:'Tarte aux pommes croustillantes et raisins secs',category:'Dessert',portions:4,ingredients:[{name:'Farine (pâte brisée)',qty:125,unit:'g'},{name:'Beurre (pâte brisée)',qty:75,unit:'g'},{name:'Jaune d’œuf',qty:1,unit:'pièce'},{name:'Sel (pâte brisée)',qty:1,unit:'pincée'},{name:'Pommes Golden',qty:5,unit:'grosses pièces'},{name:'Farine (garniture)',qty:55,unit:'g'},{name:'Cassonade',qty:55,unit:'g'},{name:'Poudre d’amande',qty:45,unit:'g'},{name:'Beurre mou',qty:45,unit:'g'},{name:'Beurre clarifié',qty:45,unit:'g'},{name:'Cannelle en poudre',qty:1,unit:'pincée'},{name:'Calvados',qty:6,unit:'cl'},{name:'Raisins de Corinthe',qty:100,unit:'g'},{name:'Sucre glace',qty:50,unit:'g'}],steps:'1. Préparer la pâte brisée : sabler la farine avec le beurre, ajouter le jaune d’œuf et le sel, puis mélanger sans trop travailler la pâte. Former un disque, filmer et laisser reposer au frais.\n2. Préchauffer le four à 180 °C. Étaler la pâte et foncer un moule à tarte.\n3. Éplucher les pommes, retirer les pépins et les couper en quartiers ou en tranches épaisses.\n4. Mélanger les 55 g de farine, la cassonade et la poudre d’amande. Ajouter le beurre mou pour obtenir une préparation sableuse.\n5. Répartir les pommes sur le fond de tarte. Ajouter les raisins de Corinthe, la cannelle et le Calvados. Parsemer du mélange croustillant, puis arroser de beurre clarifié.\n6. Cuire jusqu’à ce que la pâte soit cuite, les pommes tendres et la garniture bien dorée, environ 35 à 45 minutes selon le four et le moule.\n7. Laisser tiédir et saupoudrer de sucre glace avant de servir.',allergens:'Gluten (farine), lait (beurre), œuf, fruits à coque (amande). Calvados : alcool. Vérifier les étiquettes.',notes:'Rendement : 45 petits ramequins en aluminium. Quantités calculées sur la base de la recette initiale pour 20 ramequins. Ajuster le remplissage à la contenance réelle des petits moules et vérifier la cuisson dès 8 minutes.',cost:''},{id:'coulant-au-chocolat',name:'Coulant au chocolat',category:'Dessert',portions:20,ingredients:[{name:'Chocolat noir pâtissier 60–70 %',qty:800,unit:'g'},{name:'Beurre doux',qty:700,unit:'g'},{name:'Œufs entiers',qty:700,unit:'g'},{name:'Sucre semoule',qty:400,unit:'g'},{name:'Farine T55',qty:280,unit:'g'},{name:'Sel fin',qty:5,unit:'g'},{name:'Bombe à graisse',qty:1,unit:'bombe'}],steps:'1. Faire fondre le chocolat et le beurre au bain-marie ou au micro-ondes par petites impulsions. Mélanger et laisser tiédir vers 40–45 °C.\n2. Mélanger les œufs et le sucre sans faire trop mousser.\n3. Incorporer progressivement le mélange chocolat-beurre tiédi.\n4. Tamiser la farine avec le sel, puis incorporer sans trop travailler la pâte.\n5. Pulvériser la bombe à graisse dans les petits ramequins en aluminium.\n6. Répartir la pâte dans les ramequins sans les remplir jusqu’au bord. Cette recette permet de préparer environ 45 petits ramequins selon leur contenance.\n7. Préchauffer le four à 150 °C. Cuire 8 minutes.\n8. Laisser reposer 1 à 2 minutes avant le service.',allergens:'Gluten (farine), œufs, lait (beurre). Vérifier l’étiquetage du chocolat et de la bombe à graisse.',notes:'Rendement indicatif : environ 45 petits ramequins en aluminium selon leur contenance. Les quantités d’ingrédients restent celles de la recette de base pour 20 ramequins. Cuisson : 8 minutes à 150 °C. Liste de courses générée à partir des ingrédients de cette fiche.',cost:''},{id:'tiramisu-xavier-pincemin',name:'Tiramisu — Xavier Pincemin',category:'Dessert',portions:12,ingredients:[{name:'Biscuits à la cuillère',qty:12,unit:'pièce'},{name:'Cacao amer en poudre',qty:30,unit:'g'},{name:'Œufs',qty:4,unit:'pièce'},{name:'Sucre semoule',qty:40,unit:'g'},{name:'Mascarpone',qty:400,unit:'g'},{name:'Amaretto (appareil au mascarpone)',qty:2,unit:'c. à soupe'},{name:'Lait entier',qty:50,unit:'cl'},{name:'Crème liquide entière',qty:70,unit:'cl'},{name:'Gélatine',qty:20,unit:'g'},{name:'Gianduja',qty:450,unit:'g'},{name:'Cafés serrés',qty:4,unit:'tasse'},{name:'Amaretto (imbibage)',qty:8,unit:'c. à café'}],steps:'1. Préparer l’appareil au mascarpone : mélanger les œufs, le sucre, le mascarpone et les 2 cuillères à soupe d’amaretto jusqu’à obtenir une préparation homogène.\n2. Verser dans un siphon, ajouter 2 cartouches de gaz, secouer énergiquement puis réserver au réfrigérateur au moins 30 minutes. Respecter les consignes du fabricant.\n3. Pour la crème gianduja, faire ramollir la gélatine dans de l’eau froide. Chauffer le lait avec 50 cl de crème liquide. Verser sur le gianduja, ajouter la gélatine essorée et mixer jusqu’à obtenir une crème lisse. Réserver au froid jusqu’à ce que la préparation soit prise.\n4. Monter les 20 cl de crème liquide restants en chantilly souple. Incorporer délicatement à la crème gianduja refroidie et mettre en poche à douille.\n5. Mélanger les cafés serrés avec les 8 cuillères à café d’amaretto. Imbiber rapidement les biscuits à la cuillère et les répartir dans 12 assiettes.\n6. Pocher la crème gianduja sur les biscuits. À l’aide du siphon, former un dôme d’appareil au mascarpone.\n7. Saupoudrer de cacao amer et conserver au froid jusqu’au service.',allergens:'Gluten (biscuits), œufs, lait (mascarpone, crème, lait, gianduja). Amaretto : alcool. Vérifier les étiquettes des ingrédients.',notes:'Rendement : 12 personnes. Source d’inspiration indiquée : Xavier Pincemin. Fiche reformulée pour usage personnel dans Cuisine Pro ; ne pas réutiliser la photo de la page du livre pour une publication sans autorisation. En restauration, utiliser des œufs pasteurisés si nécessaire et maintenir la préparation au froid.',cost:''},{id:'ganache-montee-trompe-loeil',name:'Ganache montée trompe-l’œil',category:'Dessert',portions:1,ingredients:[{name:'Gélatine',qty:3,unit:'g'},{name:'Lait',qty:40,unit:'g'},{name:'Crème liquide entière',qty:280,unit:'g (dont 200 g froids)'},{name:'Chocolat blanc',qty:80,unit:'g'},{name:'Épice ou arôme au choix',qty:1,unit:'selon goût'}],steps:'1. Hydrater la gélatine dans un grand volume d’eau froide pendant 10 minutes.\n2. Chauffer le lait et 80 g de crème liquide, soit une quantité totale égale au poids du chocolat. Ajouter l’épice ou l’arôme choisi et laisser infuser.\n3. Verser le mélange chaud en deux fois sur le chocolat blanc fondu ou partiellement fondu. Mélanger à la maryse en partant du centre et en élargissant progressivement les cercles jusqu’à obtenir une émulsion brillante et homogène.\n4. Essorer la gélatine et l’incorporer au mélange encore chaud jusqu’à dissolution complète.\n5. Ajouter les 200 g de crème liquide froide restants. Mixer au mixeur plongeant en gardant la tête immergée pour parfaire l’émulsion.\n6. Verser dans un récipient à fond large, filmer au contact et réserver au réfrigérateur jusqu’à refroidissement complet, idéalement plusieurs heures.\n7. Une fois la ganache bien froide, la monter au batteur jusqu’à obtenir une texture ferme, lisse et pochable. Arrêter dès que la texture convient pour éviter qu’elle ne tranche.',allergens:'Lait. Vérifier les étiquettes du chocolat blanc, de la gélatine et de l’arôme utilisé.',notes:'Base de ganache montée au chocolat blanc, à utiliser pour des desserts trompe-l’œil. Rendement indicatif : environ 403 g avant pertes. Recette reformulée à partir de la photo fournie ; référence bibliographique non indiquée. Adapter l’arôme au trompe-l’œil souhaité.',cost:''},{id:'coque-trompe-loeil',name:'Coque pour trompe-l’œil',category:'Pâtisserie',portions:1,ingredients:[{name:'Chocolat blanc, noir ou au lait',qty:50,unit:'%'},{name:'Beurre de cacao',qty:50,unit:'% du mélange total'},{name:'Colorant liposoluble',qty:1,unit:'selon besoin'}],steps:'1. Peser le chocolat et le beurre de cacao à parts égales. Exemple : pour 500 g d’enrobage, prévoir 250 g de chocolat et 250 g de beurre de cacao.\n2. Faire fondre ensemble doucement au bain-marie ou au micro-ondes par courtes impulsions.\n3. Ajouter le ou les colorants liposolubles adaptés au chocolat, si nécessaire.\n4. Mixer au mixeur plongeant sans incorporer d’air, puis filtrer à travers un tamis fin pour retirer les éventuels morceaux.\n5. Laisser redescendre à la température adaptée, généralement autour de 38 °C, en suivant les recommandations du chocolat utilisé. Plus l’enrobage est chaud, plus la coque sera fine.\n6. Piquer le trompe-l’œil bien congelé par le dessous avec un pic ou une brochette, puis le tremper brièvement dans l’enrobage.\n7. Laisser égoutter quelques secondes. Retirer le pic en le faisant tourner doucement afin de limiter les traces.\n8. Déposer sur une plaque recouverte de film alimentaire et laisser la coque se figer.',allergens:'Lait possible selon le chocolat choisi. Vérifier les étiquettes du chocolat, du beurre de cacao et des colorants.',notes:'Base reformulée pour usage professionnel à partir de la photo fournie. Proportion : 50 % chocolat et 50 % beurre de cacao en poids. Exemple de conversion : 1 kg d’enrobage = 500 g de chocolat + 500 g de beurre de cacao. Les colorants doivent être liposolubles. L’enrobage restant peut être filtré, refroidi et conservé dans un récipient hermétique pour une réutilisation adaptée.',cost:''},{id:'creme-brulee-vanille-20',name:'Crème brûlée à la vanille',category:'Dessert',portions:20,ingredients:[{name:'Crème liquide',qty:2,unit:'L'},{name:'Lait',qty:340,unit:'g'},{name:'Gousses de vanille',qty:3,unit:'pièce'},{name:'Jaunes d’œufs',qty:640,unit:'g'},{name:'Sucre semoule',qty:340,unit:'g'},{name:'Cassonade pour caraméliser',qty:1,unit:'QS'}],steps:'1. Fendre les gousses de vanille et les gratter.\n2. Porter la crème et le lait à ébullition avec la vanille.\n3. Blanchir les jaunes d’œufs avec le sucre semoule.\n4. Verser progressivement le liquide bouillant sur les jaunes blanchis en mélangeant.\n5. Retirer les gousses de vanille et filtrer l’appareil si nécessaire.\n6. Répartir dans 20 ramequins. Passer brièvement le chalumeau à la surface pour éliminer les bulles.\n7. Placer les ramequins dans une plaque avec de l’eau chaude pour la cuisson au bain-marie. Couvrir avec un film explicitement adapté à la cuisson au four.\n8. Cuire à 115 °C environ 1 heure, jusqu’à ce que les crèmes soient prises mais encore légèrement tremblotantes au centre. Adapter le temps à la taille des ramequins et au four.\n9. Refroidir rapidement et conserver au réfrigérateur. Au service, saupoudrer de cassonade et caraméliser au chalumeau.',allergens:'Lait, œufs. Vérifier les étiquettes des produits utilisés.',notes:'Rendement : 20 portions. Ajouter la cassonade en fine couche juste avant de caraméliser au service. Utiliser uniquement un film adapté à la cuisson au four, ou un couvercle compatible.',cost:''}],tasks:[

function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');loadFailed=false;const savedRecipes=Array.isArray(saved.recipes)?saved.recipes:[];const savedTasks=Array.isArray(saved.tasks)?saved.tasks:[];const deletedStarterRecipeIds=Array.isArray(saved.deletedStarterRecipeIds)?saved.deletedStarterRecipeIds:[];const tasks=structuredClone(starter.tasks).map(base=>{const old=savedTasks.find(t=>t.id===base.id);return old?{...base,...old,frequency:base.frequency,name:base.name,area:base.area,completedPeriods:old.completedPeriods||{}}:base});for(const t of savedTasks){if(!tasks.some(x=>x.id===t.id))tasks.push({...t,completedPeriods:t.completedPeriods||{}})}return {...structuredClone(starter),...saved,tasks,deletedStarterRecipeIds,recipes:[...structuredClone(savedRecipes.filter(r=>!deletedStarterRecipeIds.includes(r.id))),...structuredClone(starter.recipes.filter(base=>!deletedStarterRecipeIds.includes(base.id)&&!savedRecipes.some(r=>r.id===base.id)))]}}catch(e){console.error('Impossible de charger les données enregistrées de Cuisine Pro.',e);loadFailed=true;alert('Les données enregistrées de Cuisine Pro sont illisibles. Pour éviter de les écraser, aucune nouvelle modification ne sera enregistrée. Restaure une sauvegarde depuis Données & paramètres ou efface volontairement les données locales.');return {...structuredClone(starter),deletedStarterRecipeIds:[]}}}function save(){if(loadFailed){db={...structuredClone(starter),deletedStarterRecipeIds:[]};persistenceError=true;alert('Enregistrement bloqué : les données locales précédentes sont illisibles. Restaure une sauvegarde ou efface volontairement les données locales.');return false}try{localStorage.setItem(KEY,JSON.stringify(db));persistenceError=false;updateStatus();queueCloudSave();return true}catch(e){console.error('Échec de sauvegarde locale Cuisine Pro.',e);persistenceError=true;db=load();alert('Cuisine Pro n’a pas pu enregistrer les modifications. Les changements non enregistrés ont été annulés à l’écran. Vérifie l’espace disponible sur ton appareil et exporte une sauvegarde dès que possible.');return false}}function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtDate(d){if(!d)return '—';return new Date(d+'T12:00:00').toLocaleDateString('fr-FR')}function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function toast(msg){if(persistenceError)return;const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>r.innerHTML='',2600)}function updateStatus(){const el=document.getElementById('connectionStatus');if(el)el.textContent=cloudUser?'● Synchronisation · '+cloudUser.email:(navigator.onLine?'● Stockage local · en ligne':'● Hors connexion · local');}
window.addEventListener('online',updateStatus);window.addEventListener('offline',updateStatus);
