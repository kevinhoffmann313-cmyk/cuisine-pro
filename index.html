ble-wrap{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:12px}.data-table{border-collapse:collapse;width:100%;min-width:590px}.data-table th,.data-table td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.data-table th{background:#f7f8f5;color:#5e6b64;font-size:11px;text-transform:uppercase;letter-spacing:.4px}.data-table tr:last-child td{border-bottom:0}.empty{padding:26px;text-align:center;color:var(--muted)}.recipe-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.recipe{background:white;border:1px solid var(--line);border-radius:13px;padding:16px}.recipe h3{margin:0 0 4px;font-size:16px}.recipe p{margin:0;color:var(--muted);font-size:12px}.recipe-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}.recipe-actions{display:flex;gap:6px}.small-btn{border:1px solid var(--line);background:white;border-radius:7px;padding:6px 8px;font-size:12px}.notice{background:#edf3ed;border:1px solid #d5e2d6;border-radius:11px;padding:13px 15px;color:#315044;font-size:13px;margin-bottom:16px}.notice.warn{background:#fff5df;border-color:#ecd9a9;color:#76500b}.hidden{display:none!important}.footer{padding:22px 4px;color:var(--muted);font-size:11px}.checkline{display:flex;align-items:center;gap:9px}.checkline input{width:18px;height:18px}.overlay{position:fixed;inset:0;background:#101b17a8;display:grid;place-items:center;padding:16px;z-index:5}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--cream);border-radius:17px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.xbtn{border:0;background:transparent;font-size:24px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172d27;color:white;padding:12px 17px;border-radius:10px;z-index:10;box-shadow:var(--shadow);max-width:90vw}.subnav{display:none}.photo-list{display:flex;fle const KEY='cuisinePro_v1';
const PHOTO_DB='cuisinePro_photos_v1';
function openPhotoDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(PHOTO_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('photos'))req.result.createObjectStore('photos',{keyPath:'id'}).createIndex('lotId','lotId',{unique:false})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function optimizePhoto(file){try{const bitmap=await createImageBitmap(file);const max=2200,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));if(scale===1&&file.size<1200000){bitmap.close();return file}const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return await new Promise(resolve=>canvas.toBlob(blob=>resolve(blob||file),'image/jpeg',0.84))}catch(e){return file}}
async function saveLotPhotos(lotId,files){const valid=files.filter(f=>f&&f.type.startsWith('image/'));if(!valid.length)return;const records=[];for(const file of valid){records.push({id:uid(),lotId,name:file.name||'photo',blob:await optimizePhoto(file)})}const d=await openPhotoDB();try{await new Promise((resolve,reject)=>{const tx=d.transaction('photos','readwrite'),st=tx.objectStore('photos');records.forEach(p=>st.put(p));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Transaction annulée'))})}finally{d.close()}}
async function showLotPhotos(lotId){const lot=db.lots.find(x=>x.id===lotId);if(!lot)return;openModal('Photos de la réception', '<p class="muted">Chargement…</p>');try{const d=await openPhotoDB();const photos=await new Promise((resolve,reject)=>{const req=d.transaction('photos','readonly').objectStore('photos').index('lotId').getAll(lotId);req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)});d.close();const root=document.querySelector('#modalRoot .modal');if(!root)return;root.innerHTML='<div class="modal-head"><h3>Photos — '+esc(lot.product)+'</h3><button class="xbtn" data-action="close-modal">×</button></div><p class="muted">Réception du '+fmtDate(lot.date)+' · Lot '+esc(lot.batch||'—')+'</p>'+(photos.length?'<div class="photo-list">'+photos.map(p=>'<div class="photo-item"><img src="'+URL.createObjectURL(p.blob)+'" alt="'+esc(p.name)+'"><small>'+esc(p.name)+'</small></div>').join('')+'</div>':'<div class="empty">Aucune photo enregistrée.</div>')+'<div class="form-actions"><button class="btn" data-action="close-modal">Fermer</button></div>'}catch(e){toast('Impossible de lire les photos.')}}

const starter={temps:[],cleaning:[],lots:[],recipes:[{id:'r1',name:'Velouté de saison',category:'Entrée',portions:10,ingredients:[{name:'Légumes de saison',qty:2,unit:'kg'},{name:'Bouillon de légumes',qty:2,unit:'L'},{name:'Crème',qty:0.3,unit:'L'}],steps:'Laver et préparer les légumes. Suer, mouiller au bouillon, cuire puis mixer. Ajouter la crème et rectifier l’assaisonnement.',allergens:'Lait (si crème utilisée)',notes:'Adapter les légumes selon arrivage.',cost:''},{id:'r2',name:'Poulet rôti, jus court',category:'Plat',portions:10,ingredients:[{name:'Poulet',qty:2.2,unit:'kg'},{name:'Oignons',qty:0.5,unit:'kg'},{name:'Fond brun',qty:1,unit:'L'}],steps:'Assaisonner et rôtir selon le protocole de cuisson validé. Réaliser le jus avec la garniture et le fond. Contrôler la cuisson à cœur avec une sonde désinfectée.',allergens:'À vérifier selon le fond utilisé',notes:'Température cible à définir dans le PMS selon le procédé validé.',cost:''},{id:'brownies-chocolat',name:'Brownies au chocolat',category:'Dessert',portions:10,ingredients:[{name:'Chocolat noir',qty:300,unit:'g'},{name:'Beurre',qty:200,unit:'g'},{name:'Sucre',qty:250,unit:'g'},{name:'Œufs',qty:4,unit:'pièce'},{name:'Farine',qty:120,unit:'g'},{name:'Cacao en poudre non sucré',qty:30,unit:'g'},{name:'Sel',qty:2,unit:'g'}],steps:'1. Préchauffer le four à 170 °C.\n2. Faire fondre doucement le chocolat noir avec le beurre, puis laisser tiédir.\n3. Mélanger les œufs et le sucre sans trop faire mousser.\n4. Incorporer le chocolat fondu. Ajouter la farine, le cacao et le sel tamisés, puis mélanger juste assez pour obtenir une pâte homogène.\n5. Verser dans un moule chemisé de papier cuisson.\n6. Cuire environ 20 à 25 minutes à 170 °C : le centre doit rester légèrement fondant. Adapter le temps à l’épaisseur et au four.\n7. Laisser refroidir avant de détailler en 10 portions.',allergens:'Gluten (farine), œufs, lait (beurre). Vérifier les étiquettes du chocolat et du cacao.',notes:'Pour 10 portions. Pour un cœur plus fondant, surveiller la cuisson en fin de parcours.',cost:''},{id:'brocoli-parmesan-sauce-cacahuete',name:'Brocolis en croûte de parmesan, sauce ricotta et beurre de cacahuètes',category:'Végétarien',portions:4,ingredients:[{name:'Brocolis',qty:2,unit:'pièce'},{name:'Oignon rouge',qty:2,unit:'pièce'},{name:'Chapelure',qty:70,unit:'g'},{name:'Parmesan râpé',qty:70,unit:'g'},{name:'Huile d’olive',qty:10,unit:'c. à café'},{name:'Persillade',qty:2,unit:'c. à soupe'},{name:'Sirop d’érable',qty:4,unit:'c. à soupe'},{name:'Sauce soja salée',qty:4,unit:'c. à soupe'},{name:'Ricotta',qty:200,unit:'g'},{name:'Yaourt grec',qty:4,unit:'c. à soupe'},{name:'Beurre de cacahuètes',qty:2,unit:'c. à soupe'},{name:'Sauce soja (pour la sauce)',qty:2,unit:'c. à soupe'},{name:'Miel',qty:2,unit:'c. à soupe'},{name:'Vinaigre blanc',qty:2,unit:'c. à soupe'},{name:'Eau',qty:1,unit:'fond à ajuster'},{name:'Sel et poivre',qty:1,unit:'à ajuster'}],steps:'1. Préchauffer le four à 190 °C.\n2. Rincer les brocolis et couper les têtes en morceaux. Émincer finement les oignons rouges.\n3. Dans un grand saladier, mélanger la chapelure, le parmesan râpé, l’huile d’olive, la persillade, le sirop d’érable et la sauce soja. Ajouter les brocolis et les oignons, puis bien mélanger pour les enrober.\n4. Répartir sur une plaque et cuire 20 à 25 minutes à 190 °C, jusqu’à ce que les brocolis soient tendres et la croûte dorée.\n5. Pour la sauce, mélanger la ricotta, le yaourt grec, le beurre de cacahuètes, la sauce soja, le miel et le vinaigre blanc. Ajouter progressivement un peu d’eau jusqu’à obtenir la texture souhaitée. Saler et poivrer.\n6. Servir les brocolis chauds avec la sauce ricotta-cacahuètes.',allergens:'Lait (parmesan, ricotta, yaourt grec), arachides (beurre de cacahuètes), soja (sauce soja), gluten possible (chapelure et sauce soja). Vérifier les étiquettes.',notes:'Quantités prévues pour 4 personnes. Cuisson au four à 190 °C pendant 20 à 25 minutes.',cost:''},{id:'tarte-pommes-croustillantes-raisins',name:'Tarte aux pommes croustillantes et raisins secs',category:'Dessert',portions:4,ingredients:[{name:'Farine (pâte brisée)',qty:125,unit:'g'},{name:'Beurre (pâte brisée)',qty:75,unit:'g'},{name:'Jaune d’œuf',qty:1,unit:'pièce'},{name:'Sel (pâte brisée)',qty:1,unit:'pincée'},{name:'Pommes Golden',qty:5,unit:'grosses pièces'},{name:'Farine (garniture)',qty:55,unit:'g'},{name:'Cassonade',qty:55,unit:'g'},{name:'Poudre d’amande',qty:45,unit:'g'},{name:'Beurre mou',qty:45,unit:'g'},{name:'Beurre clarifié',qty:45,unit:'g'},{name:'Cannelle en poudre',qty:1,unit:'pincée'},{name:'Calvados',qty:6,unit:'cl'},{name:'Raisins de Corinthe',qty:100,unit:'g'},{name:'Sucre glace',qty:50,unit:'g'}],steps:'1. Préparer la pâte brisée : sabler la farine avec le beurre, ajouter le jaune d’œuf et le sel, puis mélanger sans trop travailler la pâte. Former un disque, filmer et laisser reposer au frais.\n2. Préchauffer le four à 180 °C. Étaler la pâte et foncer un moule à tarte.\n3. Éplucher les pommes, retirer les pépins et les couper en quartiers ou en tranches épaisses.\n4. Mélanger les 55 g de farine, la cassonade et la poudre d’amande. Ajouter le beurre mou pour obtenir une préparation sableuse.\n5. Répartir les pommes sur le fond de tarte. Ajouter les raisins de Corinthe, la cannelle et le Calvados. Parsemer du mélange croustillant, puis arroser de beurre clarifié.\n6. Cuire jusqu’à ce que la pâte soit cuite, les pommes tendres et la garniture bien dorée, environ 35 à 45 minutes selon le four et le moule.\n7. Laisser tiédir et saupoudrer de sucre glace avant de servir.',allergens:'Gluten (farine), lait (beurre), œuf, fruits à coque (amande). Calvados : alcool. Vérifier les étiquettes.',notes:'Recette retranscrite depuis la photo fournie. Cuisson et étapes détaillées à ajuster selon la méthode originale du livre.',cost:''}],tasks:[

function load(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');const savedRecipes=saved.recipes||[];const savedTasks=saved.tasks||[];const tasks=structuredClone(starter.tasks).map(base=>{const old=savedTasks.find(t=>t.id===base.id);return old?{...base,...old,frequency:base.frequency,name:base.name,area:base.area,completedPeriods:old.completedPeriods||{}}:base});for(const t of savedTasks){if(!tasks.some(x=>x.id===t.id))tasks.push({...t,completedPeriods:t.completedPeriods||{}})}return {...structuredClone(starter),...saved,tasks,recipes:[...structuredClone(savedRecipes),...structuredClone(starter.recipes.filter(s=>!savedRecipes.some(r=>r.id===s.id)))]}}catch(e){return structuredClone(starter)}}function save(){localStorage.setItem(KEY,JSON.stringify(db));updateStatus()}function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtDate(d){if(!d)return '—';return new Date(d+'T12:00:00').toLocaleDateString('fr-FR')}function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>r.innerHTML='',2600)}function updateStatus(){const el=document.getElementById('connectionStatus');if(el)el.textContent=navigator.onLine?'● Local actif · en ligne':'● Hors connexion · local';}
window.addEventListener('online',updateStatus);window.addEventListener('offline',updateStatus);
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function head(title,sub,actions=''){return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div><div class="actions">${actions}</div></div>`}function btn(label,action,primary=false){return `<button class="btn ${primary?'primary':''}" data-action="${action}">${label}</button>`}
function render(){updateStatus();const m=document.getElementById('main');if(page==='home')m.innerHTML=home();if(page==='hygiene')m.innerHTML=hygiene();if(page==='trace')m.innerHTML=trace();if(page==='recipes')m.innerHTML=recipes();if(page==='production')m.innerHTML=production();if(page==='settings')m.innerHTML=settings();m.onclick=handleAction;}
function home(){const date=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});const recentTemps=db.temps.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);const isOffDay=!isWorkday();const tasks=db.tasks.filter(t=>taskIsDueToday(t));const pending=tasks.filter(t=>!taskDoneThisPeriod(t));const done=tasks.filter(t=>taskDoneThisPeriod(t));return `${head('Nettoyage du jour',date)}<div class="section"><div class="section-head"><h3>Accès rapide</h3></div><div class="quick"><button data-action="new-temp"><span>🌡</span><strong>Nouveau relevé</strong><small>Température / contrôle</small></button><button data-action="new-lot"><span>📦</span><strong>Réception produit</strong><small>Lot, DLC, fournisseur</small></button><button data-action="new-recipe"><span>📖</span><strong>Ajouter une recette</strong><small>Fiche technique</small></button><button data-action="new-task"><span>✓</span><strong>Plan de nettoyage</strong><small>Ajouter une tâche</small></button></div></div>${isOffDay?'<div class="notice">Jour non travaillé. Les tâches quotidiennes ne sont pas comptées comme en retard.</div>':''}<div class="grid"><div class="card"><div class="muted">Tâches restantes</div><div class="metric">${pending.length}</div></div><div class="card"><div class="muted">Tâches réalisées</div><div class="metric">${done.length}/${tasks.length}</div></div></div><div class="section"><div class="section-head"><h3>À accomplir</h3><button class="btn" data-page="hygiene">Voir tout le plan</button></div><div class="card">${pending.length?`<div class="list">${pending.map(t=>`<div class="list-row"><div><strong>${esc(t.name)}</strong><div class="muted">${esc(t.area||'Cuisine')} · ${esc(taskFrequency(t))}</div></div><button class="small-btn" data-action="done-task" data-id="${t.id}">Marquer fait</button></div>`).join('')}</div>`:'<div class="empty">Toutes les tâches prévues pour aujourd’hui sont réalisées.</div>'}</div></div>${recentTemps.length?`<div class="section"><div class="section-head"><h3>Derniers relevés</h3><button class="btn" data-page="hygiene">Voir l’historique</button></div><div class="card"><div class="list">${recentTemps.map(t=>`<div class="list-row"><div><strong>${esc(t.location||t.type||"Contrôle")}</strong><div class="muted">${fmtDate(t.date)} · ${esc(t.type||"")}</div></div><strong>${esc(t.value)} °C</strong></div>`).join("")}</div></div></div>`:""}${done.length?`<div class="section"><div class="section-head"><h3>Déjà réalisées</h3></div><div class="card"><div class="list">${done.map(t=>`<div class="list-row"><div><strong>${esc(t.name)}</strong><div class="muted">${esc(t.area||'Cuisine')} · ${esc(taskFrequency(t))}</div></div><span class="pill">Fait</span></div>`).join('')}</div></div></div>`:''}<div class="section">${btn('Ouvrir le plan de nettoyage','go-hygiene',true)}</div>`}
function taskFrequency(t){return ['Quotidien','Hebdomadaire','Mensuel'].includes(t.frequency)?t.frequency:'Quotidien'}function isWorkday(d=new Date()){return [1,2,4,5].includes(d.getDay())}function taskIsDueToday(t){return taskFrequency(t)!=='Quotidien'||isWorkday()}function taskPeriodKey(t){const d=new Date();if(taskFrequency(t)==='Quotidien')return 'day:'+today();if(taskFrequency(t)==='Mensuel')return 'month:'+today().slice(0,7);const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const year=x.getUTCFullYear();const first=new Date(Date.UTC(year,0,1));const week=Math.ceil((((x-first)/86400000)+1)/7);return 'week:'+year+'-W'+String(week).padStart(2,'0')}function taskDoneThisPeriod(t){const key=taskPeriodKey(t);if(t.completedPeriods&&t.completedPeriods[key])return true;return taskFrequency(t)==='Quotidien'&&t.doneDate===today()}function hygiene(){const taskGroups=['Quotidien','Hebdomadaire','Mensuel'];const due=t=>taskDoneThisPeriod(t);const dueTasks=db.tasks.filter(taskIsDueToday);const totalDone=dueTasks.filter(due).length;return `${head('Hygiène & HACCP','Historique des contrôles et suivi des opérations',btn('+ Nouveau relevé','new-temp',true)+btn('+ Tâche nettoyage','new-task'))}<div class="notice warn"><strong>Important :</strong> adaptez ce plan aux équipements réellement présents, aux produits et aux procédures de votre établissement. Respectez les étiquettes des produits de nettoyage et votre PMS validé.</div><div class="grid"><div class="card"><div class="muted">Relevés enregistrés</div><div class="metric">${db.temps.length}</div></div><div class="card"><div class="muted">Tâches dues réalisées sur la période</div><div class="metric">${totalDone}/${db.tasks.length}</div></div><div class="card"><div class="muted">Actions correctives notées</div><div class="metric">${db.temps.filter(t=>t.action).length}</div></div></div><div class="section"><div class="section-head"><h3>Relevés de température</h3></div><div class="table-wrap">${db.temps.length?`<table class="data-table"><thead><tr><th>Date</th><th>Type</th><th>Équipement / produit</th><th>Temp.</th><th>Contrôle / action</th></tr></thead><tbody>${db.temps.slice().reverse().map(t=>`<tr><td>${fmtDate(t.date)}</td><td>${esc(t.type)}</td><td>${esc(t.location)}</td><td><strong>${esc(t.value)} °C</strong></td><td>${esc(t.action||t.note||'—')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucun contrôle enregistré.</div>'}</div></div>${taskGroups.map(freq=>{const list=db.tasks.filter(t=>taskFrequency(t)===freq);if(!list.length)return '';const isOffDay=freq==='Quotidien'&&!isWorkday();return `<div class="section"><div class="section-head"><h3>${freq==='Quotidien'?'Tâches quotidiennes':freq==='Hebdomadaire'?'Tâches hebdomadaires':'Tâches mensuelles'}</h3><span class="pill">${isOffDay?'Jour non travaillé':list.filter(due).length+'/'+list.length+' réalisées'}</span></div><div class="card"><div class="list">${list.map(t=>`<div class="list-row"><div><strong>${esc(t.name)}</strong><div class="muted">${esc(t.area)} · Fréquence : ${esc(taskFrequency(t))}</div>${t.method?'<div class="muted">Produit / méthode : '+esc(t.method)+'</div>':''}${t.note?'<div class="muted">Consignes : '+esc(t.note)+'</div>':''}<div class="muted">Dernière réalisation : ${fmtDate(t.doneDate)}</div></div><div>${isOffDay?'<span class="pill">Jour non travaillé</span>':due(t)?'<span class="pill">Fait sur la période</span>':`<button class="small-btn" data-action="done-task" data-id="${t.id}">Marquer fait</button>`}</div></div>`).join('')}</div></div></div>`}).join('')}<div class="section"><div class="section-head"><h3>Historique des nettoyages</h3>${btn("Imprimer / enregistrer en PDF","print-cleaning-history",true)}</div><div class="notice">Les réalisations cochées à partir de cette mise à jour seront conservées dans cet historique et incluses dans les sauvegardes JSON. Les anciennes réalisations ne peuvent pas être reconstituées si elles n’étaient pas archivées.</div><div class="card"><div class="muted">Réalisations archivées : ${(db.cleaningHistory||[]).length}</div><div class="table-wrap">${(db.cleaningHistory||[]).length?`<table class="data-table"><thead><tr><th>Date</th><th>Heure</th><th>Tâche</th><th>Zone</th><th>Fréquence</th></tr></thead><tbody>${(db.cleaningHistory||[]).slice().reverse().map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${esc(r.time||"—")}</td><td>${esc(r.taskName)}</td><td>${esc(r.area||"—")}</td><td>${esc(r.frequency||"—")}</td></tr>`).join("")}</tbody></table>`:"<div class=\"empty\">Aucune réalisation archivée pour le moment.</div>"}</div></div></div>`}
function printCleaningHistory(){const rows=(db.cleaningHistory||[]).slice().reverse();const w=window.open('','_blank');if(!w){toast('Autorisez les fenêtres surgissantes pour imprimer.');return}const body=rows.length?rows.map(r=>'<tr><td>'+esc(fmtDate(r.date))+'</td><td>'+esc(r.time||'—')+'</td><td>'+esc(r.taskName)+'</td><td>'+esc(r.area||'—')+'</td><td>'+esc(r.frequency||'—')+'</td><td>'+esc(r.performedBy||'—')+'</td><td>'+esc([r.result,r.note].filter(Boolean).join(' — ')||'—')+'</td></tr>').join(''):'<tr><td colspan="7">Aucune réalisation enregistrée depuis l’activation de cet historique.</td></tr>';w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Historique des nettoyages</title><style>body{font:14px Arial;margin:24px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #aaa;padding:6px;text-align:left}th{background:#eee}</style></head><body><h1>Historique des nettoyages — Cuisine Pro</h1><p>Document généré le '+new Date().toLocaleString('fr-FR')+'.</p><button onclick="window.print()">Imprimer / Enregistrer en PDF</button><table><thead><tr><th>Date</th><th>Heure</th><th>Tâche</th><th>Zone</th><th>Fréquence</th><th>Responsable</th><th>Résultat / remarque</th></tr></thead><tbody>'+body+'</tbody></table><p>Ce document reprend les réalisations enregistrées dans l’application. Vérifiez qu’il correspond à votre PMS et aux exigences applicables.</p></body></html>');w.document.close()}function trace(){return `${head('Traçabilité','Réceptions, lots et photos des étiquettes',btn('+ Enregistrer une réception','new-lot',true))}<div class="notice">Prenez les photos avec l’appareil photo de votre iPhone, puis sélectionnez-les dans votre photothèque lors de l’enregistrement. Les photos restent sur cet appareil et ne sont pas automatiquement synchronisées avec le Mac.</div><div class="section"><div class="table-wrap">${db.lots.length?`<table class="data-table"><thead><tr><th>Réception</th><th>Produit</th><th>Fournisseur</th><th>N° lot</th><th>DLC / DDM</th><th>Qté</th><th>Photos</th></tr></thead><tbody>${db.lots.slice().reverse().map(l=>`<tr><td>${fmtDate(l.date)}</td><td><strong>${esc(l.product)}</strong></td><td>${esc(l.supplier||'—')}</td><td>${esc(l.batch||'—')}</td><td>${fmtDate(l.expiry)}</td><td>${esc(l.qty)} ${esc(l.unit)}</td><td><button class="small-btn" data-action="view-lot-photos" data-id="${l.id}">Voir photos</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucun lot enregistré. Ajoutez une réception pour commencer la traçabilité.</div>'}</div></div>`}
function recipes(){const count=(db.finalShoppingRecipes||[]).length,savedCount=(db.savedShoppingLists||[]).length;return `${head('Bibliothèque de recettes',`${db.recipes.length} fiche(s) technique(s)`,btn('+ Nouvelle recette','new-recipe',true))}<div class="section form-actions"><button class="btn primary" data-action="show-final-shopping">Préparer la liste (${count})</button><button class="btn" data-action="show-saved-shopping-lists">Mes listes validées (${savedCount})</button></div><input class="search" id="recipeSearch" placeholder="Rechercher une recette, un ingrédient, une catégorie…" style="margin-bottom:14px"><div class="recipe-grid" id="recipeGrid">${recipeCards(db.recipes)}</div>`}
function recipeCards(list){if(!list.length)return '<div class="empty">Aucune recette correspondante.</div>';return list.map(r=>`<article class="recipe" data-action="view-recipe" data-id="${r.id}" role="button" tabindex="0" aria-label="Ouvrir la recette ${esc(r.name)}" style="cursor:pointer"><h3>${esc(r.name)} <span aria-hidden="true" style="font-size:12px;color:var(--green)">↗ Voir la recette</span></h3><p>${esc(r.category||'Sans catégorie')} · Base ${r.portions} portion(s)</p><div class="muted" style="margin-top:9px">${r.ingredients.length} ingrédient(s) · Allergènes : ${esc(r.allergens||'À renseigner')}</div><div class="recipe-bottom"><strong>${r.cost?esc(r.cost)+' € / portion':'Coût non renseigné'}</strong><div class="recipe-actions"><button class="small-btn" data-action="scale-recipe" data-id="${r.id}">Calculer</button><button class="small-btn" data-action="edit-recipe" data-id="${r.id}">Modifier</button></div></div></article>`).join('')}
function production(){return `${head('Production','Planifier les préparations et calculer les quantités',btn('+ Planifier une production','new-production',true))}<div class="notice">Les quantités sont calculées à partir du grammage de base des fiches recettes. Vérifiez les rendements, pertes et unités avant utilisation en production.</div><div class="card"><h3 class="card-title">Calculateur rapide</h3><div class="field-grid"><div class="field"><label>Recette</label><select id="calcRecipe">${db.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>Nombre de portions souhaitées</label><input id="calcPortions" type="number" min="1" value="20"></div></div><div class="form-actions"><button class="btn primary" data-action="calculate">Calculer les quantités</button></div><div id="calcResult"></div></div><div class="section"><div class="section-head"><h3>Productions planifiées</h3></div><div class="table-wrap">${db.production.length?`<table class="data-table"><thead><tr><th>Date</th><th>Recette</th><th>Portions</th><th>Statut</th></tr></thead><tbody>${db.production.slice().reverse().map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc((db.recipes.find(r=>r.id===p.recipeId)||{}).name||'Recette supprimée')}</td><td>${p.portions}</td><td><span class="pill">${esc(p.status||'À préparer')}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucune production planifiée.</div>'}</div></div>`}
function settings(){return `${head('Données & paramètres','Sauvegarde, restauration et fonctionnement hors connexion')}<div class="notice warn">Les données sont enregistrées sur cet appareil. Exportez régulièrement une sauvegarde JSON et conservez-la ailleurs. Les relevés de température et les lots ne sont plus supprimés automatiquement au bout de six mois : vérifiez et appliquez votre propre durée de conservation réglementaire. La synchronisation multi-appareils n’est pas encore activée dans ce prototype.</div><div class="grid"><div class="card"><h3 class="card-title">Exporter une sauvegarde</h3><p class="muted">Télécharge recettes, contrôles, lots, tâches et productions en fichier JSON.</p><button class="btn primary" data-action="export">Exporter les données</button></div><div class="card"><h3 class="card-title">Restaurer une sauvegarde</h3><p class="muted">Importez un fichier JSON précédemment exporté par Cuisine Pro.</p><input type="file" id="importFile" accept="application/json,.json"></div><div class="card"><h3 class="card-title">Installation</h3><p class="muted">Sur navigateur compatible, utilisez le menu de partage ou du navigateur puis « Ajouter à l’écran d’accueil ». L’accès hors connexion dépend de l’installation et de la mise en cache.</p><span class="pill">Mode local</span></div></div><div class="section card"><h3 class="card-title">Périmètre sanitaire</h3><p class="muted">Cette version est un registre opérationnel de base, pas un PMS complet validé ni une certification de conformité. Complétez les procédures, dangers, limites critiques, surveillances, actions correctives, vérifications, responsabilités et enregistrements spécifiques à votre établissement. Vérifiez les exigences applicables auprès de votre DDPP ou de votre conseil HACCP.</p></div><div class="section">${btn('Effacer toutes les données locales','clear-data')}</div>`}
function openModal(title,body){document.getElementById('modalRoot').onclick=handleAction;document.getElementById('modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="modal"><div class="modal-head"><h3>${title}</h3><button class="xbtn" data-action="close-modal" aria-label="Fermer">×</button></div>${body}</section></div>`;document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()})}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function field(label,name,type='text',value='',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(label,name,options,value=''){return `<div class="field"><label>${label}</label><select name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}function formShell(id,fields,submit){return `<form id="${id}"><div class="field-grid">${fields}</div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">${submit||'Enregistrer'}</button></div></form>`}
function printRecipeShopping(id){const r=db.recipes.find(x=>x.id===id);if(!r)return;const w=window.open('','_blank');if(!w){alert('Autorise les fenêtres contextuelles pour imprimer la liste.');return}w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Liste de courses</title><style>body{font:15px Arial;margin:24px}li{padding:6px 0}</style></head><body><h2>Liste de courses — '+esc(r.name)+'</h2><p>Base : '+esc(r.portions)+' portion(s) · '+new Date().toLocaleDateString('fr-FR')+'</p><ul>'+r.ingredients.map(i=>'<li>☐ '+esc(i.name)+' — '+esc(i.qty)+' '+esc(i.unit)+'</li>').join('')+'</ul></body></html>');w.document.close();w.focus();w.print()}
function handleAction(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='close-modal')return closeModal();if(a==='go-hygiene')return go('hygiene');if(a==='new-temp')return modalTemp();if(a==='new-lot')return modalLot();if(a==='view-lot-photos')return showLotPhotos(id);if(a==='new-task')return modalTask();if(a==='new-recipe')return modalRecipe();if(a==='view-recipe'&&e.target.closest('button')===null)return modalViewRecipe(db.recipes.find(r=>r.id===id));if(a==='edit-recipe')return modalRecipe(db.recipes.find(r=>r.id===id));if(a==='add-recipe-to-final-shopping')return addRecipeToFinalShopping(id);if(a==='show-final-shopping')return showFinalShoppingList();if(a==='validate-final-shopping')return validateFinalShopping();if(a==='show-saved-shopping-lists')return showSavedShoppingLists();if(a==='open-saved-shopping-list')return openSavedShoppingList(id);if(a==='finish-saved-shopping-list')return finishSavedShoppingList(id);if(a==='print-saved-shopping-list')return printSavedShoppingList(id);if(a==='remove-final-shopping-recipe')return removeFinalShoppingRecipe(id);if(a==='clear-final-shopping')return clearFinalShopping();if(a==='print-final-shopping')return printFinalShopping();if(a==='scale-recipe')return modalScale(db.recipes.find(r=>r.id===id));if(a==='done-task'){const t=db.tasks.find(t=>t.id===id);if(t){const now=new Date();t.completedPeriods=t.completedPeriods||{};t.completedPeriods[taskPeriodKey(t)]=today();t.doneDate=today();db.cleaningHistory=Array.isArray(db.cleaningHistory)?db.cleaningHistory:[];db.cleaningHistory.push({id:uid(),taskId:t.id,taskName:t.name,area:t.area,frequency:taskFrequency(t),date:today(),time:now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),completedAt:now.toISOString(),performedBy:'',result:'Réalisé',note:''});save();render();toast('Réalisation enregistrée dans l’historique.')}return}if(a==='print-cleaning-history')return printCleaningHistory();if(a==='calculate')return calculate();if(a==='new-production')return modalProduction();if(a==='export')return exportData();if(a==='clear-data'){if(confirm('Effacer définitivement toutes les données locales de Cuisine Pro sur cet appareil ?')){localStorage.removeItem(KEY);db=structuredClone(starter);save();render();toast('Données locales réinitialisées.')}return}}
function modalTemp(){openModal('Nouveau relevé de température',formShell('tempForm',field('Date','date','date',today(),'required')+selectField('Type de contrôle','type',['Froid','Congélation','Réception','Cuisson à cœur','Refroidissement','Remise en température','Autre'],'Froid')+field('Équipement / produit','location','text','','required placeholder="Ex. Chambre froide positive"')+field('Température mesurée (°C)','value','number','','required step="0.1"')+field('Limite / référence PMS','limit','text','','placeholder="Référence validée dans votre PMS"')+`<div class="field full"><label>Observation / action corrective si nécessaire</label><textarea name="action" placeholder="Écart constaté, produit isolé, nouvelle mesure, décision et responsable…"></textarea></div>`,'Enregistrer le relevé'));document.getElementById('tempForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.temps.push({id:uid(),date:f.get('date'),type:f.get('type'),location:f.get('location'),value:f.get('value'),limit:f.get('limit'),action:f.get('action')});save();closeModal();render();toast('Relevé enregistré localement.') }}
function modalLot(){openModal('Enregistrer une réception',`<form id="lotForm"><div class="field-grid">${field('Date de réception','date','date',today(),'required')}${field('Produit','product','text','','required placeholder="Ex. Filet de truite"')}${field('Fournisseur','supplier')}${field('Numéro de lot','batch')}${field('DLC / DDM','expiry','date')}${field('Quantité','qty','number','','min="0" step="any"')}${selectField('Unité','unit',['kg','g','L','mL','pièce','colis'])}<div class="field full"><label>Photos des étiquettes (plusieurs possibles)</label><input name="photos" id="lotPhotos" type="file" accept="image/*" multiple><small class="muted">Sélectionnez les photos de votre photothèque. Elles seront conservées sur cet appareil.</small><div id="photoPreview" class="photo-list"></div></div><div class="field full"><label>Contrôles / remarques réception</label><textarea name="note" placeholder="Température, emballage, conformité, décision…"></textarea></div></div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">Enregistrer la réception</button></div></form>`);document.getElementById('lotPhotos').addEventListener('change',e=>{const p=document.getElementById('photoPreview');p.innerHTML='';Array.from(e.target.files).forEach(f=>{if(f.type.startsWith('image/')){const im=document.createElement('img');im.className='photo-thumb';im.alt=f.name;im.src=URL.createObjectURL(f);p.appendChild(im)}})});document.getElementById('lotForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),lot={id:uid(),date:f.get('date'),product:f.get('product'),supplier:f.get('supplier'),batch:f.get('batch'),expiry:f.get('expiry'),qty:f.get('qty'),unit:f.get('unit'),note:f.get('note')};try{await saveLotPhotos(lot.id,Array.from(document.getElementById('lotPhotos').files||[]));db.lots.push(lot);save();closeModal();render();toast('Réception et photos enregistrées sur cet appareil.')}catch(err){toast('Erreur de stockage des photos. Réessayez avec moins de photos.')}}}
function modalTask(){openModal('Ajouter une tâche de nettoyage',formShell('taskForm',field('Tâche','name','text','','required')+field('Zone / équipement','area','text','','required')+selectField('Fréquence','frequency',['Quotidien','Hebdomadaire','Mensuel'],'Quotidien')+field('Produit / méthode','method')+`<div class="field full"><label>Consignes et vérification</label><textarea name="note" placeholder="Produit utilisé, dosage selon étiquette, temps de contact, rinçage si requis…"></textarea></div>`,'Ajouter la tâche'));document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.tasks.push({id:uid(),name:f.get('name'),area:f.get('area'),frequency:f.get('frequency'),method:f.get('method'),note:f.get('note'),doneDate:'',completedPeriods:{}});save();closeModal();render();toast('Tâche ajoutée.') }}
function modalRecipe(r){r=r||{id:'',name:'',category:'Plat',portions:10,ingredients:[],steps:'',allergens:'',notes:'',cost:''};const ing=r.ingredients.map(i=>`${i.name}|${i.qty}|${i.unit}`).join('\n');openModal(r.id?'Modifier la recette':'Nouvelle recette',`<form id="recipeForm"><div class="field-grid">${field('Nom de la recette','name','text',r.name,'required')}${selectField('Catégorie','category',['Entrée','Poisson','Viande','Végétarien','Accompagnement','Sauce / base','Dessert','Pâtisserie','Autre'],r.category)}${field('Portions de référence','portions','number',r.portions,'required min="1"')}${field('Coût matière par portion (€)','cost','number',r.cost,'min="0" step="0.01"')}</div><div class="field" style="margin-top:13px"><label>Ingrédients — une ligne par ingrédient : nom | quantité | unité</label><textarea name="ingredients" required style="min-height:130px" placeholder="Carottes | 1.5 | kg&#10;Crème | 0.2 | L">${esc(ing)}</textarea><small class="muted">Utilisez un point pour les décimales. Gardez des unités cohérentes pour les calculs.</small></div><div class="field" style="margin-top:13px"><label>Étapes de réalisation</label><textarea name="steps">${esc(r.steps)}</textarea></div><div class="field" style="margin-top:13px"><label>Allergènes à déclarer (à vérifier à partir des ingrédients et étiquettes)</label><input name="allergens" value="${esc(r.allergens)}"></div><div class="field" style="margin-top:13px"><label>Notes, rendement, conservation, mise en place</label><textarea name="notes">${esc(r.notes)}</textarea></div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">Enregistrer la recette</button></div></form>`);document.getElementById('recipeForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);let ingredients=[];for(const line of f.get('ingredients').split('\n').map(x=>x.trim()).filter(Boolean)){const parts=line.split('|').map(x=>x.trim());if(parts.length<3||!parts[0]||!Number.isFinite(Number(parts[1]))){toast('Format ingrédient invalide. Utilisez : nom | quantité | unité');return}ingredients.push({name:parts[0],qty:Number(parts[1]),unit:parts.slice(2).join('|')})}const obj={id:r.id||uid(),name:f.get('name'),category:f.get('category'),portions:Number(f.get('portions')),cost:f.get('cost'),ingredients,steps:f.get('steps'),allergens:f.get('allergens'),notes:f.get('notes')};if(r.id)db.recipes=db.recipes.map(x=>x.id===r.id?obj:x);else db.recipes.push(obj);save();closeModal();render();toast('Recette enregistrée.') }}
function modalViewRecipe(r){if(!r)return;const shopping=r.ingredients&&r.ingredients.length?`<div class="section"><h4>Liste de courses de cette recette</h4><div class="recipe-ingredient-list">${r.ingredients.map(i=>`<div class="recipe-ingredient-row"><span class="recipe-ingredient-name">${esc(i.name)}</span><span class="recipe-ingredient-qty">${esc(i.qty)} ${esc(i.unit)}</span></div>`).join('')}</div><div class="form-actions"><button class="btn primary" data-action="add-recipe-to-final-shopping" data-id="${esc(r.id)}">Ajouter à la liste finale</button></div></div>`:'<div class="notice">Ajoute des ingrédients à cette fiche pour créer sa liste de courses.</div>';openModal(esc(r.name),`<div class="muted">${esc(r.category||'Sans catégorie')} · Base ${r.portions} portion(s)</div><div class="section"><h4>Ingrédients de la recette</h4><ul class="recipe-ingredient-list">${r.ingredients.map(i=>`<li class="recipe-ingredient-row"><span class="recipe-ingredient-name">- ${esc(i.name)}</span><span class="recipe-ingredient-qty">${esc(i.qty)} ${esc(i.unit)}</span></li>`).join('')}</ul></div><div class="section"><h4>Étapes de réalisation</h4><p style="white-space:pre-wrap">${esc(r.steps||'À renseigner')}</p></div><div class="section"><h4>Allergènes</h4><p>${esc(r.allergens||'À vérifier')}</p></div>${r.notes?`<div class="section"><h4>Notes</h4><p style="white-space:pre-wrap">${esc(r.notes)}</p></div>`:''}${shopping}<div class="form-actions"><button class="btn" data-action="close-modal">Fermer</button><button class="btn" data-action="scale-recipe" data-id="${r.id}">Calculer les quantités</button><button class="btn primary" data-action="edit-recipe" data-id="${r.id}">Modifier</button></div>`)}
function addRecipeToFinalShopping(id){const r=db.recipes.find(x=>x.id===id);if(!r)return;db.finalShoppingRecipes=Array.isArray(db.finalShoppingRecipes)?db.finalShoppingRecipes:[];if(db.finalShoppingRecipes.some(x=>x.recipeId===id)){toast('Cette recette est déjà dans la liste finale.');return}db.finalShoppingRecipes.push({recipeId:r.id,name:r.name,portions:Number(r.portions)||1,ingredients:structuredClone(r.ingredients||[])});save();toast('Recette ajoutée à la liste finale.');}
function shoppingCategory(name){const n=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(/alcool|calvados|rhum|vin blanc|vin rouge|vin jaune|porto|cognac|armagnac|kirsch|liqueur|biere|bière|cidre|vodka|gin|whisky|champagne/.test(n))return 'Alcools & boissons';if(/boeuf|veau|porc|agneau|poulet|volaille|canard|dinde|jambon|lard|bacon|saucisse|chorizo|viande|foie|steak|rumsteck|paleron/.test(n))return 'Viandes & charcuterie';if(/poisson|truite|saumon|cabillaud|morue|thon|sardine|maquereau|moule|coquille|saint.?jacques|crevette|crabe|homard|calamar|encornet|fruits de mer/.test(n))return 'Poissons & produits de la mer';if(/pain|baguette|brioche|croissant|viennoiserie|pate feuilletee|pate brisee|feuilletage|wrap|tortilla|pain de mie/.test(n))return 'Pain & viennoiseries';if(/lait|creme|fromage|comte|emmental|parmesan|mozzarella|ricotta|mascarpone|philadelphia|chevre|yaourt|oeuf|feta|roquefort|beurre/.test(n))return 'Crèmerie';if(/farine|sucre|riz|spaghetti|pate|semoule|lentille|pois chiche|haricot rouge|levure|chocolat|cacao|vanille|huile|vinaigre|sel|poivre|epice|paprika|cumin|curry|moutarde|miel|sirop|noix|amande|noisette|cacahuete|pistache|biscuit|chapelure|bouillon|conserve|cannelle|raisin sec|raisin de corinthe|poudre d|farine|beurre de cacahuete/.test(n))return 'Épicerie & produits secs';if(/pomme|poire|banane|citron|orange|pamplemousse|fraise|framboise|myrtille|fruit|tomate|carotte|oignon|echalote|ail|poireau|brocoli|courgette|aubergine|poivron|salade|roquette|epinard|champignon|persil|coriandre|basilic|thym|romarin|ciboulette|pomme de terre|patate|chou|haricot vert|concombre|avocat|legume/.test(n))return 'Fruits & légumes';if(/surgele|glace/.test(n))return 'Surgelés';return 'Autres produits'}
function normalizeShoppingName(name){let n=String(name||'Ingrédient à préciser').trim().toLocaleLowerCase('fr-FR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s*\([^)]*\)\s*/g,' ').replace(/\s+/g,' ').trim();n=n.replace(/^(farine|beurre|sucre|huile|creme|raisins? de corinthe|raisins? secs?)\s+(?:pour la |pour le |de la |du |de l'|de )?(pate brisee|garniture|recette|la sauce)$/,'$1');if(/^beurre(?:\s+(?:mou|clarifie|fondu|pommade|demi-sel|doux|sale|ramolli))?$/.test(n))return 'beurre';if(/^beurre de cacahuete(?:s)?$/.test(n))return 'beurre de cacahuète';if(/^farine(?:\s+.+)?$/.test(n))return 'farine';if(/^sucre(?:\s+(?:glace|en poudre|semoule|cristallise))?$/.test(n))return 'sucre';if(/^raisin(?:s)?(?:\s+de corinthe|\s+secs?)?$/.test(n))return 'raisins secs';if(/^huile(?:\s+d olive)?$/.test(n))return 'huile';if(/^oeuf(?:s)?(?:\s+entier(?:s)?)?$/.test(n))return 'œufs';if(/^jaune d oeuf$/.test(n))return 'jaune d’œuf';if(/^pommes? golden$/.test(n))return 'pommes Golden';if(/^parmesan(?: rape)?$/.test(n))return 'parmesan';return n.charAt(0).toLocaleUpperCase('fr-FR')+n.slice(1)}function shoppingUnit(unit){const u=String(unit||'').trim().toLocaleLowerCase('fr-FR');if(['g','gramme','grammes'].includes(u))return 'g';if(['kg','kilo','kilos','kilogramme','kilogrammes'].includes(u))return 'kg';if(['ml','millilitre','millilitres'].includes(u))return 'ml';if(['l','litre','litres'].includes(u))return 'l';if(['piece','pièce','pieces','pièces','unité','unites','unités'].includes(u))return 'pièce(s)';return String(unit||'').trim()}function finalShoppingGroups(){const groups={};for(const r of db.finalShoppingRecipes||[]){for(const i of r.ingredients||[]){const originalName=String(i.name||'Ingrédient à préciser').trim(),name=normalizeShoppingName(originalName),unit=shoppingUnit(i.unit),qty=Number(i.qty),category=shoppingCategory(name),key=name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('fr-FR')+'|'+unit.toLocaleLowerCase('fr-FR');groups[category]=groups[category]||{};if(!groups[category][key])groups[category][key]={name,unit,qty,valid:Number.isFinite(qty)};else if(groups[category][key].valid&&Number.isFinite(qty))groups[category][key].qty+=qty;else groups[category][key].valid=false}}const order=['Fruits & légumes','Pain & viennoiseries','Crèmerie','Viandes & charcuterie','Poissons & produits de la mer','Épicerie & produits secs','Alcools & boissons','Surgelés','Autres produits'];return order.filter(c=>groups[c]).map(category=>({category,items:Object.values(groups[category]).sort((a,b)=>a.name.localeCompare(b.name,'fr'))}))}
function showFinalShoppingList(){const recipes=db.finalShoppingRecipes||[],groups=finalShoppingGroups();openModal('Liste finale des courses',`<div class="section"><h4>Recettes ajoutées</h4>${recipes.length?'<div class="list">'+recipes.map(r=>'<div class="list-row"><span>'+esc(r.name)+'<div class="muted">Base '+esc(r.portions)+' portion(s)</div></span><button class="small-btn" data-action="remove-final-shopping-recipe" data-id="'+esc(r.recipeId)+'">Retirer</button></div>').join('')+'</div>':'<p class="muted">Aucune recette ajoutée pour le moment.</p>'}</div><div class="section"><h4>Liste de courses classée par rayon</h4>${groups.length?groups.map(g=>'<div class="section"><h4>'+esc(g.category)+'</h4><div class="list">'+g.items.map(i=>'<div class="list-row"><span>'+esc(i.name)+'</span><strong>'+(i.valid?i.qty.toLocaleString('fr-FR',{maximumFractionDigits:3})+' ':'Quantité à vérifier ')+esc(i.unit)+'</strong></div>').join('')+'</div></div>').join(''):'<p class="muted">Ajoute des recettes pour générer la liste.</p>'}</div><div class="form-actions"><button class="btn" data-action="close-modal">Fermer</button><button class="btn" data-action="clear-final-shopping">Vider la liste</button><button class="btn" data-action="print-final-shopping" ${groups.length?'':'disabled'}>Imprimer</button><button class="btn primary" data-action="validate-final-shopping" ${groups.length?'':'disabled'}>Valider et enregistrer</button></div>`)}
function validateFinalShopping(){const groups=finalShoppingGroups();if(!groups.length){toast('La liste est vide.');return}const name=prompt('Nom de cette liste de courses :','Courses du '+new Date().toLocaleDateString('fr-FR'));if(name===null)return;db.savedShoppingLists=Array.isArray(db.savedShoppingLists)?db.savedShoppingLists:[];db.savedShoppingLists.unshift({id:uid(),name:name.trim()||('Courses du '+new Date().toLocaleDateString('fr-FR')),createdAt:new Date().toISOString(),status:'active',items:groups.flatMap(g=>g.items.map(i=>({id:uid(),category:g.category,name:i.name,qty:i.qty,unit:i.unit,valid:i.valid,checked:false}))),recipes:(db.finalShoppingRecipes||[]).map(r=>r.name)});db.finalShoppingRecipes=[];save();closeModal();render();toast('Liste validée et enregistrée.')}function showSavedShoppingLists(){db.savedShoppingLists=Array.isArray(db.savedShoppingLists)?db.savedShoppingLists:[];openModal('Mes listes de courses',db.savedShoppingLists.length?'<div class="list">'+db.savedShoppingLists.map(l=>'<div class="list-row"><span><strong>'+esc(l.name)+'</strong><div class="muted">'+new Date(l.createdAt).toLocaleDateString('fr-FR')+' · '+(l.status==='done'?'Terminée':(l.items||[]).filter(i=>!i.checked).length+' article(s) restants')+'</div></span><button class="btn primary" data-action="open-saved-shopping-list" data-id="'+esc(l.id)+'">Ouvrir</button></div>').join('')+'</div>':'<p class="muted">Aucune liste enregistrée. Prépare une liste finale puis valide-la.</p>')}function openSavedShoppingList(id){const l=(db.savedShoppingLists||[]).find(x=>x.id===id);if(!l)return;const order=['Fruits & légumes','Pain & viennoiseries','Crèmerie','Viandes & charcuterie','Poissons & produits de la mer','Épicerie & produits secs','Alcools & boissons','Surgelés','Autres produits'];const remaining=(l.items||[]).filter(i=>!i.checked).length;openModal(l.name+' ('+remaining+' restant(s))',`<div class="section"><p class="muted">Coche chaque article quand tu l’as pris. La progression est enregistrée automatiquement.</p>${order.filter(c=>(l.items||[]).some(i=>i.category===c)).map(c=>'<div class="section"><h4>'+esc(c)+'</h4><div class="list">'+l.items.filter(i=>i.category===c).map(i=>'<div class="list-row"><label style="display:flex;align-items:center;gap:10px;flex:1"><input type="checkbox" '+(i.checked?'checked':'')+' data-action="toggle-saved-shopping-item" data-list-id="'+esc(l.id)+'" data-item-id="'+esc(i.id)+'"><span style="'+(i.checked?'text-decoration:line-through;opacity:.55':'')+'">'+esc(i.name)+'</span></label><strong>'+ (i.valid?i.qty.toLocaleString('fr-FR',{maximumFractionDigits:3})+' ':'')+esc(i.unit)+'</strong></div>').join('')+'</div></div>').join('')}</div><div class="form-actions"><button class="btn" data-action="show-saved-shopping-lists">Retour aux listes</button><button class="btn" data-action="print-saved-shopping-list" data-id="${esc(l.id)}">Imprimer</button><button class="btn primary" data-action="finish-saved-shopping-list" data-id="${esc(l.id)}">${remaining?'Terminer la liste':'Marquer comme terminée'}</button></div>`)}function toggleSavedShoppingItem(listId,itemId,checked){const l=(db.savedShoppingLists||[]).find(x=>x.id===listId);const i=l&&l.items.find(x=>x.id===itemId);if(!i)return;i.checked=checked;save();openSavedShoppingList(listId)}function finishSavedShoppingList(id){const l=(db.savedShoppingLists||[]).find(x=>x.id===id);if(!l)return;if(l.items.some(i=>!i.checked)){if(!confirm('Il reste des articles non cochés. Marquer quand même cette liste comme terminée ?'))return}l.status='done';l.completedAt=new Date().toISOString();save();showSavedShoppingLists()}function printSavedShoppingList(id){const l=(db.savedShoppingLists||[]).find(x=>x.id===id);if(!l)return;const w=window.open('','_blank');if(!w){alert('Autorise les fenêtres contextuelles pour imprimer.');return}const order=['Fruits & légumes','Pain & viennoiseries','Crèmerie','Viandes & charcuterie','Poissons et produits de la mer','Épicerie & produits secs','Alcools & boissons','Surgelés','Autres produits'];w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>'+esc(l.name)+'</title><style>body{font:14px Arial;margin:24px}h2{margin-top:20px}li{padding:4px 0}</style></head><body><h1>'+esc(l.name)+'</h1>'+order.filter(c=>l.items.some(i=>i.category===c)).map(c=>'<h2>'+esc(c)+'</h2><ul>'+l.items.filter(i=>i.category===c).map(i=>'<li>'+ (i.checked?'✓':'☐')+' '+esc(i.name)+' — '+(i.valid?i.qty:'')+' '+esc(i.unit)+'</li>').join('')+'</ul>').join('')+'</body></html>');w.document.close();w.focus();w.print()}

function printFinalShopping(){const recipes=db.finalShoppingRecipes||[],groups=finalShoppingGroups();if(!groups.length){toast('La liste finale est vide.');return}const w=window.open('','_blank');if(!w){alert('Autorise les fenêtres contextuelles pour imprimer.');return}w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Liste finale des courses</title><style>body{font:14px Arial;margin:24px;color:#222}li{padding:5px 0}h2{margin-top:20px}</style></head><body><h1>Liste finale des courses</h1><p>'+new Date().toLocaleDateString('fr-FR')+'</p>'+groups.map(g=>'<h2>'+esc(g.category)+'</h2><ul>'+g.items.map(i=>'<li>☐ '+esc(i.name)+' — '+(i.valid?i.qty.toLocaleString('fr-FR',{maximumFractionDigits:3}):'quantité à vérifier')+' '+esc(i.unit)+'</li>').join('')+'</ul>').join('')+'</body></html>');w.document.close();w.focus();w.print()}
function modalScale(r){if(!r)return;openModal('Calcul des quantités',`<div class="field"><label>Nombre de portions souhaitées</label><input id="scaleN" type="number" min="1" value="${r.portions}" required></div><div class="form-actions"><button class="btn primary" data-action="scale-show" data-id="${r.id}">Calculer</button></div><div id="scaleResult" style="margin-top:16px"></div>`);document.querySelector('[data-action="scale-show"]').onclick=()=>{const n=Number(document.getElementById('scaleN').value);if(!n||n<1)return;document.getElementById('scaleResult').innerHTML=scaleHtml(r,n)}}function scaleHtml(r,n){const f=n/r.portions;return `<p class="muted">${n} portions · coefficient ×${f.toLocaleString('fr-FR',{maximumFractionDigits:3})}</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Ingrédient</th><th>Quantité calculée</th></tr></thead><tbody>${r.ingredients.map(i=>`<tr><td>${esc(i.name)}</td><td>${(i.qty*f).toLocaleString('fr-FR',{maximumFractionDigits:3})} ${esc(i.unit)}</td></tr>`).join('')}</tbody></table></div><h4>Étapes</h4><p>${esc(r.steps||'À renseigner')}</p><h4>Allergènes déclarés dans la fiche</h4><p>${esc(r.allergens||'À vérifier')}</p><p class="muted">Vérifiez rendements, pertes, unités et allergènes avant production.</p>`}
function calculate(){const id=document.getElementById('calcRecipe')?.value;const n=Number(document.getElementById('calcPortions')?.value);const r=db.recipes.find(x=>x.id===id);const out=document.getElementById('calcResult');if(!r||!n||n<1){out.innerHTML='<p class="muted">Sélectionnez une recette et un nombre de portions valide.</p>';return}out.innerHTML=scaleHtml(r,n)}function modalProduction(){openModal('Planifier une production',formShell('prodForm',selectField('Recette','recipeId',db.recipes.map(r=>r.name))+field('Date prévue','date','date',today(),'required')+field('Nombre de portions','portions','number','10','required min="1"')+selectField('Statut','status',['À préparer','En cours','Terminé'])+`<div class="field full"><label>Notes de production</label><textarea name="notes"></textarea></div>`,'Planifier'));document.getElementById('prodForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const recipe=db.recipes.find(r=>r.name===f.get('recipeId'));if(!recipe)return;db.production.push({id:uid(),recipeId:recipe.id,date:f.get('date'),portions:Number(f.get('portions')),status:f.get('status'),notes:f.get('notes')});save();closeModal();render();toast('Production planifiée.')}}
function blobToDataURL(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob)})}
function dataURLToBlob(url){const parts=url.split(',');const match=parts[0].match(/data:(.*?);base64/);if(!match)throw Error('Photo invalide');const binary=atob(parts[1]);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:match[1]||'application/octet-stream'})}
function sixMonthCutoff(){const d=new Date();d.setMonth(d.getMonth()-6);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function recordDate(r){return String(r.date||r.receivedAt||r.createdAt||'').slice(0,10)}async function purgeExpiredRecords(){try{const activeLots=new Set((db.lots||[]).map(l=>l.id));const photos=await allStoredPhotos();const expired=photos.filter(p=>!activeLots.has(p.lotId));if(expired.length){const d=await openPhotoDB();try{await new Promise((resolve,reject)=>{const tx=d.transaction('photos','readwrite'),st=tx.objectStore('photos');expired.forEach(p=>st.delete(p.id));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{d.close()}}}catch(e){console.warn('Nettoyage des photos orphelines impossible',e)}}async function allStoredPhotos(){const d=await openPhotoDB();try{return await new Promise((resolve,reject)=>{const req=d.transaction('photos','readonly').objectStore('photos').getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)})}finally{d.close()}}
async function replaceStoredPhotos(photos){const records=(photos||[]).filter(p=>p&&p.id&&p.lotId&&p.dataUrl).map(p=>({id:p.id,lotId:p.lotId,name:p.name||'photo',blob:dataURLToBlob(p.dataUrl)}));const d=await openPhotoDB();try{await new Promise((resolve,reject)=>{const tx=d.transaction('photos','readwrite'),st=tx.objectStore('photos');st.clear();records.forEach(p=>st.put(p));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Transaction annulée'))})}finally{d.close()}}
async function exportData(){try{const photos=await allStoredPhotos();const photoData=[];for(const p of photos){photoData.push({id:p.id,lotId:p.lotId,name:p.name||'photo',dataUrl:await blobToDataURL(p.blob)})}const payload={version:2,exportedAt:new Date().toISOString(),data:db,photos:photoData};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='cuisine-pro-sauvegarde-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Sauvegarde exportée avec '+photoData.length+' photo(s).')}catch(err){console.error(err);toast('Export impossible. Vérifiez l’espace disponible et réessayez.')}}
function remindBackup(){const key='cuisinePro_lastBackupReminder';const last=localStorage.getItem(key);const now=Date.now();if(!last||now-Number(last)>7*24*60*60*1000){setTimeout(()=>{if(confirm('Pensez à exporter une sauvegarde de Cuisine Pro, surtout avant une mise à jour. Voulez-vous ouvrir les données et paramètres ?'))go('settings');localStorage.setItem(key,String(now))},1200)}}
document.addEventListener('input',e=>{if(e.target.id==='recipeSearch'){const q=e.target.value.toLowerCase();const list=db.recipes.filter(r=>[r.name,r.category,r.allergens,...r.ingredients.map(i=>i.name)].join(' ').toLowerCase().includes(q));document.getElementById('recipeGrid').innerHTML=recipeCards(list)}});document.addEventListener('change',e=>{if(e.target.id==='importFile'){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=async()=>{try{const x=JSON.parse(reader.result);const incoming=x.data||x;if(!incoming.recipes||!incoming.temps||!incoming.lots)throw Error('structure');if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'+(Array.isArray(x.photos)?' Les '+x.photos.length+' photo(s) incluses seront également restaurées.':' Cette ancienne sauvegarde ne contient pas de photos.')))return;const restored={...structuredClone(starter),...incoming};await replaceStoredPhotos(Array.isArray(x.photos)?x.photos:[]);db=restored;save();render();toast('Sauvegarde restaurée'+(Array.isArray(x.photos)?' avec '+x.photos.length+' photo(s)':' sans photos (ancienne sauvegarde)')+'.')}catch(err){console.error(err);alert('Fichier invalide ou restauration impossible. Vérifiez le fichier et l’espace disponible.')}};reader.readAsText(file)}});
if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}render();remindBackup();
</script></body></html>
