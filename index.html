<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173b32"><meta name="description" content="Cuisine Pro — gestion sanitaire, traçabilité, recettes et production."><link rel="manifest" href="manifest.webmanifest"><title>Cuisine Pro</title>
<style>
:root{--green:#173b32;--green2:#245849;--cream:#f5f4ee;--paper:#fff;--ink:#17221f;--muted:#6b7772;--line:#dce3dd;--red:#a33232;--amber:#92620b;--shadow:0 8px 28px #18382b0c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;min-height:100vh}.top{background:var(--green);color:white;padding:20px clamp(16px,4vw,36px) 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border:1px solid #ffffff55;border-radius:13px;display:grid;place-items:center;font-size:23px}.brand h1{font-size:21px;margin:0;letter-spacing:-.5px}.brand p{margin:2px 0 0;color:#c5d8d0;font-size:12px}.status{font-size:12px;background:#ffffff17;border:1px solid #ffffff30;border-radius:999px;padding:7px 10px;white-space:nowrap}.layout{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:24px clamp(14px,3vw,32px)}nav{display:flex;flex-direction:column;gap:5px}nav button{background:transparent;border:0;text-align:left;border-radius:10px;padding:12px 13px;color:#52605a;display:flex;align-items:center;gap:10px}nav button.active,nav button:hover{background:#e2e9e2;color:var(--green);font-weight:650}.nav-icon{width:21px;text-align:center}.nav-foot{margin-top:auto;padding:16px 10px;color:var(--muted);font-size:12px}.content{min-width:0}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:0 0 20px}.page-head h2{font-size:26px;letter-spacing:-.7px;margin:0}.page-head p{color:var(--muted);margin:5px 0 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:9px 13px;font-weight:600}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.danger{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow);min-width:0}.metric{font-size:28px;font-weight:750;letter-spacing:-1px;margin:10px 0 1px}.muted{color:var(--muted);font-size:13px}.card-title{font-weight:700;margin:0 0 12px}.section{margin-top:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 11px}.section-head h3{font-size:17px;margin:0}.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.quick button{border:1px solid var(--line);background:white;border-radius:13px;padding:16px;text-align:left;color:var(--ink)}.quick button span{font-size:22px;display:block;margin-bottom:8px}.quick strong{display:block}.quick small{color:var(--muted)}.list{display:flex;flex-direction:column}.list-row{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.list-row:last-child{border-bottom:0}.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:4px 8px;background:#e7eee8;color:var(--green)}.pill.warn{background:#fff0ce;color:#80550a}.pill.bad{background:#f9e3e1;color:#8e2828}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#53615a}.field input,.field select,.field textarea,.search{width:100%;padding:10px 11px;border:1px solid #cfd8d1;border-radius:8px;background:white;color:var(--ink);min-width:0}.field textarea{min-height:84px;resize:vertical}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.table-wrap{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:12px}.data-table{border-collapse:collapse;width:100%;min-width:590px}.data-table th,.data-table td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.data-table th{background:#f7f8f5;color:#5e6b64;font-size:11px;text-transform:uppercase;letter-spacing:.4px}.data-table tr:last-child td{border-bottom:0}.empty{padding:26px;text-align:center;color:var(--muted)}.recipe-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.recipe{background:white;border:1px solid var(--line);border-radius:13px;padding:16px}.recipe h3{margin:0 0 4px;font-size:16px}.recipe p{margin:0;color:var(--muted);font-size:12px}.recipe-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}.recipe-actions{display:flex;gap:6px}.small-btn{border:1px solid var(--line);background:white;border-radius:7px;padding:6px 8px;font-size:12px}.notice{background:#edf3ed;border:1px solid #d5e2d6;border-radius:11px;padding:13px 15px;color:#315044;font-size:13px;margin-bottom:16px}.notice.warn{background:#fff5df;border-color:#ecd9a9;color:#76500b}.hidden{display:none!important}.footer{padding:22px 4px;color:var(--muted);font-size:11px}.checkline{display:flex;align-items:center;gap:9px}.checkline input{width:18px;height:18px}.overlay{position:fixed;inset:0;background:#101b17a8;display:grid;place-items:center;padding:16px;z-index:5}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--cream);border-radius:17px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.xbtn{border:0;background:transparent;font-size:24px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172d27;color:white;padding:12px 17px;border-radius:10px;z-index:10;box-shadow:var(--shadow);max-width:90vw}.subnav{display:none}
@media(max-width:760px){.layout{display:block;padding:16px 13px 92px}.top{padding:16px}.brand h1{font-size:18px}.status{font-size:10px}.layout nav{position:fixed;z-index:4;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));display:flex;flex-direction:row;justify-content:space-around;gap:2px}.layout nav button{flex:1;flex-direction:column;gap:3px;text-align:center;padding:7px 2px;font-size:10px;border-radius:8px}.nav-icon{font-size:17px}.nav-foot{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:13px}.metric{font-size:24px}.quick{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick button{padding:12px}.page-head{flex-direction:column}.page-head h2{font-size:23px}.recipe-grid{grid-template-columns:1fr}.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.form-actions{justify-content:stretch}.form-actions button{flex:1}.section{margin-top:16px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">♨</div><div><h1>Cuisine Pro</h1><p>Hygiène · Recettes · Production</p></div></div><div class="status" id="connectionStatus">● Stockage local actif</div></header><div class="layout"><nav id="nav"><button class="active" data-page="home"><span class="nav-icon">⌂</span>Accueil</button><button data-page="hygiene"><span class="nav-icon">✓</span>Hygiène</button><button data-page="trace"><span class="nav-icon">▤</span>Traçabilité</button><button data-page="recipes"><span class="nav-icon">▧</span>Recettes</button><button data-page="production"><span class="nav-icon">☷</span>Production</button><button data-page="settings"><span class="nav-icon">⚙</span>Données</button><div class="nav-foot">Version prototype 0.1<br>Données enregistrées sur cet appareil.</div></nav><main class="content" id="main"></main></div></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='cuisinePro_v1';
const starter={temps:[],cleaning:[],lots:[],recipes:[{id:'r1',name:'Velouté de saison',category:'Entrée',portions:10,ingredients:[{name:'Légumes de saison',qty:2,unit:'kg'},{name:'Bouillon de légumes',qty:2,unit:'L'},{name:'Crème',qty:0.3,unit:'L'}],steps:'Laver et préparer les légumes. Suer, mouiller au bouillon, cuire puis mixer. Ajouter la crème et rectifier l’assaisonnement.',allergens:'Lait (si crème utilisée)',notes:'Adapter les légumes selon arrivage.',cost:''},{id:'r2',name:'Poulet rôti, jus court',category:'Plat',portions:10,ingredients:[{name:'Poulet',qty:2.2,unit:'kg'},{name:'Oignons',qty:0.5,unit:'kg'},{name:'Fond brun',qty:1,unit:'L'}],steps:'Assaisonner et rôtir selon le protocole de cuisson validé. Réaliser le jus avec la garniture et le fond. Contrôler la cuisson à cœur avec une sonde désinfectée.',allergens:'À vérifier selon le fond utilisé',notes:'Température cible à définir dans le PMS selon le procédé validé.',cost:''}],tasks:[{id:'c1',name:'Nettoyage et désinfection du plan de travail',frequency:'Après utilisation',area:'Plan de travail',doneDate:''},{id:'c2',name:'Contrôle et nettoyage des poignées',frequency:'Quotidien',area:'Zones de contact',doneDate:''},{id:'c3',name:'Contrôle visuel des chambres froides',frequency:'Quotidien',area:'Froid',doneDate:''}],production:[]};
let db=load();let page='home';let toastTimer;
function load(){try{return {...structuredClone(starter),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(starter)}}function save(){localStorage.setItem(KEY,JSON.stringify(db));updateStatus()}function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtDate(d){if(!d)return '—';return new Date(d+'T12:00:00').toLocaleDateString('fr-FR')}function today(){return new Date().toISOString().slice(0,10)}function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>r.innerHTML='',2600)}function updateStatus(){const el=document.getElementById('connectionStatus');if(el)el.textContent=navigator.onLine?'● Local actif · en ligne':'● Hors connexion · local';}
window.addEventListener('online',updateStatus);window.addEventListener('offline',updateStatus);
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function head(title,sub,actions=''){return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div><div class="actions">${actions}</div></div>`}function btn(label,action,primary=false){return `<button class="btn ${primary?'primary':''}" data-action="${action}">${label}</button>`}
function render(){updateStatus();const m=document.getElementById('main');if(page==='home')m.innerHTML=home();if(page==='hygiene')m.innerHTML=hygiene();if(page==='trace')m.innerHTML=trace();if(page==='recipes')m.innerHTML=recipes();if(page==='production')m.innerHTML=production();if(page==='settings')m.innerHTML=settings();m.onclick=handleAction;}
function home(){const openTasks=db.tasks.filter(t=>t.doneDate!==today()).length;const cold=db.temps.filter(t=>t.type==='Froid').length;const date=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});return `${head('Tableau de bord',date)}<div class="grid"><div class="card"><div class="muted">Recettes enregistrées</div><div class="metric">${db.recipes.length}</div><div class="muted">Fiches techniques</div></div><div class="card"><div class="muted">Contrôles température</div><div class="metric">${db.temps.length}</div><div class="muted">Relevés conservés</div></div><div class="card"><div class="muted">Tâches à réaliser aujourd’hui</div><div class="metric">${openTasks}</div><div class="muted">Nettoyage / désinfection</div></div><div class="card"><div class="muted">Lots enregistrés</div><div class="metric">${db.lots.length}</div><div class="muted">Traçabilité réception</div></div><div class="card"><div class="muted">Productions planifiées</div><div class="metric">${db.production.length}</div><div class="muted">Préparations</div></div><div class="card"><div class="muted">Mode de fonctionnement</div><div class="metric" style="font-size:20px">${navigator.onLine?'En ligne':'Hors ligne'}</div><div class="muted">Données conservées localement</div></div></div><div class="section"><div class="section-head"><h3>Accès rapide</h3></div><div class="quick"><button data-action="new-temp"><span>🌡</span><strong>Nouveau relevé</strong><small>Température / contrôle</small></button><button data-action="new-lot"><span>📦</span><strong>Réception produit</strong><small>Lot, DLC, fournisseur</small></button><button data-action="new-recipe"><span>📖</span><strong>Ajouter une recette</strong><small>Fiche technique</small></button><button data-action="new-task"><span>✓</span><strong>Plan de nettoyage</strong><small>Ajouter une tâche</small></button></div></div><div class="section"><div class="section-head"><h3>Derniers relevés</h3>${btn('Voir les contrôles','go-hygiene')}</div><div class="card">${db.temps.length?`<div class="list">${db.temps.slice(-4).reverse().map(t=>`<div class="list-row"><div><strong>${esc(t.location)}</strong><div class="muted">${fmtDate(t.date)} · ${esc(t.type)}</div></div><strong>${esc(t.value)} °C</strong></div>`).join('')}</div>`:'<div class="empty">Aucun relevé pour le moment.</div>'}</div></div><div class="footer">Prototype de suivi interne. Les paramètres, seuils, fréquences et procédures doivent être validés et adaptés à votre PMS.</div>`}
function hygiene(){return `${head('Hygiène & HACCP','Historique des contrôles et suivi des opérations',btn('+ Nouveau relevé','new-temp',true)+btn('+ Tâche nettoyage','new-task'))}<div class="notice warn"><strong>Important :</strong> les limites de température ne sont pas préconfigurées comme seuils réglementaires. Saisissez les limites de votre PMS validé et définissez les actions correctives à appliquer en cas d’écart.</div><div class="grid"><div class="card"><div class="muted">Relevés enregistrés</div><div class="metric">${db.temps.length}</div></div><div class="card"><div class="muted">Tâches du jour réalisées</div><div class="metric">${db.tasks.filter(t=>t.doneDate===today()).length}/${db.tasks.length}</div></div><div class="card"><div class="muted">Actions correctives notées</div><div class="metric">${db.temps.filter(t=>t.action).length}</div></div></div><div class="section"><div class="section-head"><h3>Relevés de température</h3></div><div class="table-wrap">${db.temps.length?`<table class="data-table"><thead><tr><th>Date</th><th>Type</th><th>Équipement / produit</th><th>Temp.</th><th>Contrôle / action</th></tr></thead><tbody>${db.temps.slice().reverse().map(t=>`<tr><td>${fmtDate(t.date)}</td><td>${esc(t.type)}</td><td>${esc(t.location)}</td><td><strong>${esc(t.value)} °C</strong></td><td>${esc(t.action||t.note||'—')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucun contrôle enregistré.</div>'}</div></div><div class="section"><div class="section-head"><h3>Plan de nettoyage</h3></div><div class="card"><div class="list">${db.tasks.map(t=>`<div class="list-row"><div><strong>${esc(t.name)}</strong><div class="muted">${esc(t.area)} · Fréquence : ${esc(t.frequency)}</div><div class="muted">Dernière réalisation : ${fmtDate(t.doneDate)}</div></div><div>${t.doneDate===today()?'<span class="pill">Fait aujourd’hui</span>':`<button class="small-btn" data-action="done-task" data-id="${t.id}">Marquer fait</button>`}</div></div>`).join('')||'<div class="empty">Aucune tâche définie.</div>'}</div></div></div>`}
function trace(){return `${head('Traçabilité','Réceptions, lots et dates de conservation',btn('+ Enregistrer une réception','new-lot',true))}<div class="notice">Pour chaque réception, enregistrez les informations réellement présentes sur l’étiquette et les documents fournisseur. La fiche ne remplace pas les contrôles de réception de votre PMS.</div><div class="section"><div class="table-wrap">${db.lots.length?`<table class="data-table"><thead><tr><th>Réception</th><th>Produit</th><th>Fournisseur</th><th>N° lot</th><th>DLC / DDM</th><th>Qté</th></tr></thead><tbody>${db.lots.slice().reverse().map(l=>`<tr><td>${fmtDate(l.date)}</td><td><strong>${esc(l.product)}</strong></td><td>${esc(l.supplier||'—')}</td><td>${esc(l.batch||'—')}</td><td>${fmtDate(l.expiry)}</td><td>${esc(l.qty)} ${esc(l.unit)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucun lot enregistré. Ajoutez une réception pour commencer la traçabilité.</div>'}</div></div>`}
function recipes(){return `${head('Bibliothèque de recettes',`${db.recipes.length} fiche(s) technique(s)`,btn('+ Nouvelle recette','new-recipe',true))}<input class="search" id="recipeSearch" placeholder="Rechercher une recette, un ingrédient, une catégorie…" style="margin-bottom:14px"><div class="recipe-grid" id="recipeGrid">${recipeCards(db.recipes)}</div>`}function recipeCards(list){if(!list.length)return '<div class="empty">Aucune recette correspondante.</div>';return list.map(r=>`<article class="recipe"><h3>${esc(r.name)}</h3><p>${esc(r.category||'Sans catégorie')} · Base ${r.portions} portion(s)</p><div class="muted" style="margin-top:9px">${r.ingredients.length} ingrédient(s) · Allergènes : ${esc(r.allergens||'À renseigner')}</div><div class="recipe-bottom"><strong>${r.cost?esc(r.cost)+' € / portion':'Coût non renseigné'}</strong><div class="recipe-actions"><button class="small-btn" data-action="scale-recipe" data-id="${r.id}">Calculer</button><button class="small-btn" data-action="edit-recipe" data-id="${r.id}">Modifier</button></div></div></article>`).join('')}
function production(){return `${head('Production','Planifier les préparations et calculer les quantités',btn('+ Planifier une production','new-production',true))}<div class="notice">Les quantités sont calculées à partir du grammage de base des fiches recettes. Vérifiez les rendements, pertes et unités avant utilisation en production.</div><div class="card"><h3 class="card-title">Calculateur rapide</h3><div class="field-grid"><div class="field"><label>Recette</label><select id="calcRecipe">${db.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>Nombre de portions souhaitées</label><input id="calcPortions" type="number" min="1" value="20"></div></div><div class="form-actions"><button class="btn primary" data-action="calculate">Calculer les quantités</button></div><div id="calcResult"></div></div><div class="section"><div class="section-head"><h3>Productions planifiées</h3></div><div class="table-wrap">${db.production.length?`<table class="data-table"><thead><tr><th>Date</th><th>Recette</th><th>Portions</th><th>Statut</th></tr></thead><tbody>${db.production.slice().reverse().map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc((db.recipes.find(r=>r.id===p.recipeId)||{}).name||'Recette supprimée')}</td><td>${p.portions}</td><td><span class="pill">${esc(p.status||'À préparer')}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucune production planifiée.</div>'}</div></div>`}
function settings(){return `${head('Données & paramètres','Sauvegarde, restauration et fonctionnement hors connexion')}<div class="notice warn">Les données sont enregistrées sur cet appareil. Pour éviter toute perte, exportez régulièrement une sauvegarde. La synchronisation multi-appareils n’est pas encore activée dans ce prototype.</div><div class="grid"><div class="card"><h3 class="card-title">Exporter une sauvegarde</h3><p class="muted">Télécharge recettes, contrôles, lots, tâches et productions en fichier JSON.</p><button class="btn primary" data-action="export">Exporter les données</button></div><div class="card"><h3 class="card-title">Restaurer une sauvegarde</h3><p class="muted">Importez un fichier JSON précédemment exporté par Cuisine Pro.</p><input type="file" id="importFile" accept="application/json,.json"></div><div class="card"><h3 class="card-title">Installation</h3><p class="muted">Sur navigateur compatible, utilisez le menu de partage ou du navigateur puis « Ajouter à l’écran d’accueil ». L’accès hors connexion dépend de l’installation et de la mise en cache.</p><span class="pill">Mode local</span></div></div><div class="section card"><h3 class="card-title">Périmètre sanitaire</h3><p class="muted">Cette version est un registre opérationnel de base, pas un PMS complet validé ni une certification de conformité. Complétez les procédures, dangers, limites critiques, surveillances, actions correctives, vérifications, responsabilités et enregistrements spécifiques à votre établissement. Vérifiez les exigences applicables auprès de votre DDPP ou de votre conseil HACCP.</p></div><div class="section">${btn('Effacer toutes les données locales','clear-data')}</div>`}
function openModal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="modal"><div class="modal-head"><h3>${title}</h3><button class="xbtn" data-action="close-modal" aria-label="Fermer">×</button></div>${body}</section></div>`;document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()})}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function field(label,name,type='text',value='',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(label,name,options,value=''){return `<div class="field"><label>${label}</label><select name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}function formShell(id,fields,submit){return `<form id="${id}"><div class="field-grid">${fields}</div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">${submit||'Enregistrer'}</button></div></form>`}
function handleAction(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='close-modal')return closeModal();if(a==='go-hygiene')return go('hygiene');if(a==='new-temp')return modalTemp();if(a==='new-lot')return modalLot();if(a==='new-task')return modalTask();if(a==='new-recipe')return modalRecipe();if(a==='edit-recipe')return modalRecipe(db.recipes.find(r=>r.id===id));if(a==='scale-recipe')return modalScale(db.recipes.find(r=>r.id===id));if(a==='done-task'){const t=db.tasks.find(t=>t.id===id);if(t){t.doneDate=today();save();render();toast('Tâche marquée comme réalisée.')}return}if(a==='calculate')return calculate();if(a==='new-production')return modalProduction();if(a==='export')return exportData();if(a==='clear-data'){if(confirm('Effacer définitivement toutes les données locales de Cuisine Pro sur cet appareil ?')){localStorage.removeItem(KEY);db=structuredClone(starter);save();render();toast('Données locales réinitialisées.')}return}}
function modalTemp(){openModal('Nouveau relevé de température',formShell('tempForm',field('Date','date','date',today(),'required')+selectField('Type de contrôle','type',['Froid','Congélation','Réception','Cuisson à cœur','Refroidissement','Remise en température','Autre'],'Froid')+field('Équipement / produit','location','text','','required placeholder="Ex. Chambre froide positive"')+field('Température mesurée (°C)','value','number','','required step="0.1"')+field('Limite / référence PMS','limit','text','','placeholder="Référence validée dans votre PMS"')+`<div class="field full"><label>Observation / action corrective si nécessaire</label><textarea name="action" placeholder="Écart constaté, produit isolé, nouvelle mesure, décision et responsable…"></textarea></div>`,'Enregistrer le relevé'));document.getElementById('tempForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.temps.push({id:uid(),date:f.get('date'),type:f.get('type'),location:f.get('location'),value:f.get('value'),limit:f.get('limit'),action:f.get('action')});save();closeModal();render();toast('Relevé enregistré localement.') }}
function modalLot(){openModal('Enregistrer une réception',formShell('lotForm',field('Date de réception','date','date',today(),'required')+field('Produit','product','text','','required')+field('Fournisseur','supplier')+field('Numéro de lot','batch')+field('DLC / DDM','expiry','date')+field('Quantité','qty','number','','min="0" step="any"')+selectField('Unité','unit',['kg','g','L','mL','pièce','colis'])+`<div class="field full"><label>Contrôles / remarques réception</label><textarea name="note" placeholder="Température, emballage, conformité, décision…"></textarea></div>`,'Enregistrer le lot'));document.getElementById('lotForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.lots.push({id:uid(),date:f.get('date'),product:f.get('product'),supplier:f.get('supplier'),batch:f.get('batch'),expiry:f.get('expiry'),qty:f.get('qty'),unit:f.get('unit'),note:f.get('note')});save();closeModal();render();toast('Réception enregistrée.') }}
function modalTask(){openModal('Ajouter une tâche de nettoyage',formShell('taskForm',field('Tâche','name','text','','required')+field('Zone / équipement','area','text','','required')+selectField('Fréquence','frequency',['Après utilisation','Plusieurs fois par jour','Quotidien','Hebdomadaire','Mensuel','Selon procédure'])+field('Produit / méthode','method')+`<div class="field full"><label>Consignes et vérification</label><textarea name="note" placeholder="Produit utilisé, dosage selon étiquette, temps de contact, rinçage si requis…"></textarea></div>`,'Ajouter la tâche'));document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.tasks.push({id:uid(),name:f.get('name'),area:f.get('area'),frequency:f.get('frequency'),method:f.get('method'),note:f.get('note'),doneDate:''});save();closeModal();render();toast('Tâche ajoutée.') }}
function modalRecipe(r){r=r||{id:'',name:'',category:'Plat',portions:10,ingredients:[],steps:'',allergens:'',notes:'',cost:''};const ing=r.ingredients.map(i=>`${i.name}|${i.qty}|${i.unit}`).join('\n');openModal(r.id?'Modifier la recette':'Nouvelle recette',`<form id="recipeForm"><div class="field-grid">${field('Nom de la recette','name','text',r.name,'required')}${selectField('Catégorie','category',['Entrée','Poisson','Viande','Végétarien','Accompagnement','Sauce / base','Dessert','Pâtisserie','Autre'],r.category)}${field('Portions de référence','portions','number',r.portions,'required min="1"')}${field('Coût matière par portion (€)','cost','number',r.cost,'min="0" step="0.01"')}</div><div class="field" style="margin-top:13px"><label>Ingrédients — une ligne par ingrédient : nom | quantité | unité</label><textarea name="ingredients" required style="min-height:130px" placeholder="Carottes | 1.5 | kg&#10;Crème | 0.2 | L">${esc(ing)}</textarea><small class="muted">Utilisez un point pour les décimales. Gardez des unités cohérentes pour les calculs.</small></div><div class="field" style="margin-top:13px"><label>Étapes de réalisation</label><textarea name="steps">${esc(r.steps)}</textarea></div><div class="field" style="margin-top:13px"><label>Allergènes à déclarer (à vérifier à partir des ingrédients et étiquettes)</label><input name="allergens" value="${esc(r.allergens)}"></div><div class="field" style="margin-top:13px"><label>Notes, rendement, conservation, mise en place</label><textarea name="notes">${esc(r.notes)}</textarea></div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">Enregistrer la recette</button></div></form>`);document.getElementById('recipeForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);let ingredients=[];for(const line of f.get('ingredients').split('\n').map(x=>x.trim()).filter(Boolean)){const parts=line.split('|').map(x=>x.trim());if(parts.length<3||!parts[0]||!Number.isFinite(Number(parts[1]))){toast('Format ingrédient invalide. Utilisez : nom | quantité | unité');return}ingredients.push({name:parts[0],qty:Number(parts[1]),unit:parts.slice(2).join('|')})}const obj={id:r.id||uid(),name:f.get('name'),category:f.get('category'),portions:Number(f.get('portions')),cost:f.get('cost'),ingredients,steps:f.get('steps'),allergens:f.get('allergens'),notes:f.get('notes')};if(r.id)db.recipes=db.recipes.map(x=>x.id===r.id?obj:x);else db.recipes.push(obj);save();closeModal();render();toast('Recette enregistrée.') }}
function modalScale(r){if(!r)return;openModal('Calcul des quantités',`<div class="field"><label>Nombre de portions souhaitées</label><input id="scaleN" type="number" min="1" value="${r.portions}" required></div><div class="form-actions"><button class="btn primary" data-action="scale-show" data-id="${r.id}">Calculer</button></div><div id="scaleResult" style="margin-top:16px"></div>`);document.querySelector('[data-action="scale-show"]').onclick=()=>{const n=Number(document.getElementById('scaleN').value);if(!n||n<1)return;document.getElementById('scaleResult').innerHTML=scaleHtml(r,n)}}function scaleHtml(r,n){const f=n/r.portions;return `<p class="muted">${n} portions · coefficient ×${f.toLocaleString('fr-FR',{maximumFractionDigits:3})}</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Ingrédient</th><th>Quantité calculée</th></tr></thead><tbody>${r.ingredients.map(i=>`<tr><td>${esc(i.name)}</td><td>${(i.qty*f).toLocaleString('fr-FR',{maximumFractionDigits:3})} ${esc(i.unit)}</td></tr>`).join('')}</tbody></table></div><h4>Étapes</h4><p>${esc(r.steps||'À renseigner')}</p><h4>Allergènes déclarés dans la fiche</h4><p>${esc(r.allergens||'À vérifier')}</p><p class="muted">Vérifiez rendements, pertes, unités et allergènes avant production.</p>`}
function calculate(){const id=document.getElementById('calcRecipe')?.value;const n=Number(document.getElementById('calcPortions')?.value);const r=db.recipes.find(x=>x.id===id);const out=document.getElementById('calcResult');if(!r||!n||n<1){out.innerHTML='<p class="muted">Sélectionnez une recette et un nombre de portions valide.</p>';return}out.innerHTML=scaleHtml(r,n)}function modalProduction(){openModal('Planifier une production',formShell('prodForm',selectField('Recette','recipeId',db.recipes.map(r=>r.name))+field('Date prévue','date','date',today(),'required')+field('Nombre de portions','portions','number','10','required min="1"')+selectField('Statut','status',['À préparer','En cours','Terminé'])+`<div class="field full"><label>Notes de production</label><textarea name="notes"></textarea></div>`,'Planifier'));document.getElementById('prodForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const recipe=db.recipes.find(r=>r.name===f.get('recipeId'));if(!recipe)return;db.production.push({id:uid(),recipeId:recipe.id,date:f.get('date'),portions:Number(f.get('portions')),status:f.get('status'),notes:f.get('notes')});save();closeModal();render();toast('Production planifiée.')}}
function exportData(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cuisine-pro-sauvegarde-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Export préparé.')}
document.addEventListener('input',e=>{if(e.target.id==='recipeSearch'){const q=e.target.value.toLowerCase();const list=db.recipes.filter(r=>[r.name,r.category,r.allergens,...r.ingredients.map(i=>i.name)].join(' ').toLowerCase().includes(q));document.getElementById('recipeGrid').innerHTML=recipeCards(list)}});document.addEventListener('change',e=>{if(e.target.id==='importFile'){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);const incoming=x.data||x;if(!incoming.recipes||!incoming.temps||!incoming.lots)throw Error('structure');if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){db={...structuredClone(starter),...incoming};save();render();toast('Sauvegarde restaurée.')}}catch(err){alert('Fichier invalide ou incompatible. Aucune donnée importée.')}};reader.readAsText(file)}});
if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}render();
</script></body></html>
