function head(title,sub,actions=''){return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div><div class="actions">${actions}</div></div>`}function btn(label,action,primary=false){return `<button class="btn ${primary?'primary':''}" data-action="${action}">${label}</button>`}
function render(){updateStatus();const m=document.getElementById('main');if(page==='home')m.innerHTML=home();if(page==='hygiene')m.innerHTML=hygiene();if(page==='trace')m.innerHTML=trace();if(page==='recipes')m.innerHTML=recipes();if(page==='production')m.innerHTML=production();if(page==='settings')m.innerHTML=settings();m.onclick=handleAction;}
function home(){const date=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});const recentTemps=db.temps.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);const isOffDay=!isWorkday();const tasks=db.tasks.filter(t=>taskIsDueToday(t));const pending=tasks.filter(t=>!taskDoneThisPeriod(t));const done=tasks.filter(t=>taskDoneThisPeriod(t));return `${head('Nettoyage du jour',date)}<div class="section"><div class="section-head"><h3>Accès rapide</h3></div><div class="quick"><button data-action="new-temp"><span>🌡</span><strong>Nouveau relevé</strong><small>Température / contrôle</small></button><button data-action="new-lot"><span>📦</span><strong>Réception produit</strong><small>Lot, DLC, fournisseur</small></button><button data-action="new-recipe"><span>📖</span><strong>Ajouter une recette</strong><small>Fiche technique</small></button><button data-action="new-task"><span>✓</span><strong>Plan de nettoyage</strong><small>Ajouter une tâche</small></button></div></div>${isOffDay?'<div class="notice">Jour non travaillé. Les tâches quotidiennes ne sont pas comptées comme en retard.</div>':''}<div class="grid"><div class="card"><div class="muted">Tâches restantes</div><div class="metric">${pending.length}</div></div><div class="card"><div class="muted">Tâches réalisées</div><div class="metric">${done.length}/${tasks.length}</div></div></div><div class="section"><div class="section-head"><h3>À accomplir</h3><button class="btn" data-page="hygiene">Voir tout le plan</button></div><div class="card">${pending.length?`<div class="list">${pending.map(t=>`<div class="list-row"><div><strong>${esc(t.name)}</strong><div class="muted">${esc(t.area||'Cuisine')} · ${esc(taskFrequency(t))}</div></div><button class="small-btn" data-action="done-task" data-id="${t.id}">Marquer fait</button></div>`).join('')}</div>`:'<div class="empty">Toutes les tâches prévues pour aujourd’hui sont réalisées.</div>'}</div></div>${recentTemps.length?`<div class="section"><div class="section-head"><h3>Derniers relevés</h3><button class="btn" data-page="hygiene">Voir l’historique</button></div><div class="card"><div class="list">${recentTemps.map(t=>`<div class="list-row"><div><strong>${esc(t.location||t.type||"Contrôle")}</strong><div class="muted">${fmtDate(t.date)} · ${esc(t.type||"")}</div></div><strong>${esc(t.value)} °C</strong></div>`).join("")}</div></div></div>`:""}${done.length?`<div class="section"><div class="section-head"><h3>Déjà réalisées</h3></div><div class="card"><div class="list">${done.map(t=>`<div class="list-row"><div><strong>${esc(t.name)}</strong><div class="muted">${esc(t.area||'Cuisine')} · ${esc(taskFrequency(t))}</div></div><span class="pill">Fait</span></div>`).join('')}</div></div></div>`:''}<div class="section">${btn('Ouvrir le plan de nettoyage','go-hygiene',true)}</div>`}
function taskFrequency(t){return ['Quotidien','Hebdomadaire','Mensuel'].includes(t.frequency)?t.frequency:'Quotidien'}function isWorkday(d=new Date()){return [1,2,4,5].includes(d.getDay())}function taskIsDueToday(t){return taskFrequency(t)!=='Quotidien'||isWorkday()}function taskPeriodKey(t){const d=new Date();if(taskFrequency(t)==='Quotidien')return 'day:'+today();if(taskFrequency(t)==='Mensuel')return 'month:'+today().slice(0,7);const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const year=x.getUTCFullYear();const first=new Date(Date.UTC(year,0,1));const week=Math.ceil((((x-first)/86400000)+1)/7);return 'week:'+year+'-W'+String(week).padStart(2,'0')}function taskDoneThisPeriod(t){const key=taskPeriodKey(t);if(t.completedPeriods&&t.completedPeriods[key])return true;return taskFrequency(t)==='Quotidien'&&t.doneDate===today()}function isoWeekInfo(dateValue){const d=new Date((dateValue||today())+'T12:00:00');if(Number.isNaN(d.getTime()))return {key:'inconnu',label:'Semaine inconnue',start:'',end:''};const day=d.getDay()||7;d.setDate(d.getDate()+4-day);const year=d.getFullYear();const first=new Date(year,0,1);const week=Math.ceil((((d-first)/86400000)+1)/7);const monday=new Date(d);monday.setDate(d.getDate()-day+1);const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);const fmt=x=>x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});return {key:year+'-W'+String(week).padStart(2,'0'),label:'Semaine '+week+' · '+year,start:fmt(monday),end:fmt(sunday),week,year}}
function hygiene(){const taskGroups=['Quotidien','Hebdomadaire','Mensuel'];const due=t=>taskDoneThisPeriod(t);const dueTasks=db.tasks.filter(taskIsDueToday);const totalDone=dueTasks.filter(due).length;const history=Array.isArray(db.cleaningHistory)?db.cleaningHistory:[];const weeks={};const addWeek=(date,type,item)=>{const info=isoWeekInfo(date);if(!weeks[info.key])weeks[info.key]={...info,cleaning:[],temps:[]};weeks[info.key][type].push(item)};history.forEach(r=>addWeek(r.date,'cleaning',r));db.temps.forEach(t=>addWeek(t.date,'temps',t));const current=isoWeekInfo(today());if(!weeks[current.key])weeks[current.key]={...current,cleaning:[],temps:[]};const weekList=Object.values(weeks).sort((a,b)=>b.key.localeCompare(a.key));return `${head('Hygiène & HACCP','Suivi hebdomadaire des contrôles et des tâches',btn('+ Nouveau relevé','new-temp',true)+btn('+ Tâche nettoyage','new-task'))}<div class="notice warn"><strong>Important :</strong> adaptez ce plan aux équipements réellement présents, aux produits et aux procédures de votre établissement. Respectez les étiquettes des produits de nettoyage et votre PMS validé.</div><div class="grid"><div class="card"><div class="muted">Relevés enregistrés</div><div class="metric">${db.temps.length}</div></div><div class="card"><div class="muted">Tâches dues réalisées sur la période</div><div class="metric">${totalDone}/${db.tasks.length}</div></div><div class="card"><div class="muted">Actions correctives notées</div><div class="metric">${db.temps.filter(t=>t.action).length}</div></div></div><div class="section"><div class="section-head"><h3>Historique par semaine</h3><span class="pill">${weekList.length} semaine(s)</span></div><div class="muted" style="margin-bottom:10px">Ouvre une semaine pour retrouver les tâches de nettoyage archivées et les relevés de température enregistrés.</div>${weekList.map(w=>`<details class="card" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700;padding:4px 0">${w.label} <span class="muted" style="font-weight:400">(${w.start} – ${w.end})</span><span class="pill" style="margin-left:8px">${w.cleaning.length+w.temps.length} élément(s)</span></summary><div style="margin-top:14px"><h4>Nettoyages réalisés (${w.cleaning.length})</h4>${w.cleaning.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Heure</th><th>Tâche</th><th>Zone</th><th>Fréquence</th><th>Observation</th></tr></thead><tbody>${w.cleaning.slice().sort((a,b)=>(b.completedAt||b.date||'').localeCompare(a.completedAt||a.date||'')).map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${esc(r.time||'—')}</td><td>${esc(r.taskName)}</td><td>${esc(r.area||'—')}</td><td>${esc(r.frequency||'—')}</td><td>${esc([r.result,r.note].filter(Boolean).join(' — ')||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aucune tâche de nettoyage archivée cette semaine.</div>'}<h4 style="margin-top:16px">Températures relevées (${w.temps.length})</h4>${w.temps.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Type</th><th>Équipement / produit</th><th>Temp.</th><th>Limite / action</th></tr></thead><tbody>${w.temps.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(t=>`<tr><td>${fmtDate(t.date)}</td><td>${esc(t.type)}</td><td>${esc(t.location)}</td><td><strong>${esc(t.value)} °C</strong></td><td>${esc([t.limit,t.action||t.note].filter(Boolean).join(' — ')||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aucun relevé de température cette semaine.</div>'}</div></details>`).join('')}</div><div class="section"><div class="section-head"><h3>Plan de nettoyage</h3><span class="pill">${totalDone}/${dueTasks.length} tâches dues réalisées</span></div><div class="muted" style="margin-bottom:10px">Les tâches sont repliées par fréquence pour garder cette page lisible. Chaque clic sur « Marquer fait » archive la réalisation avec sa date.</div>${taskGroups.map(freq=>{const list=db.tasks.filter(t=>taskFrequency(t)===freq);if(!list.length)return '';const isOffDay=freq==='Quotidien'&&!isWorkday();return `<details class="card" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700;padding:4px 0">${freq==='Quotidien'?'Tâches quotidiennes':freq==='Hebdomadaire'?'Tâches hebdomadaires':'Tâches mensuelles'} <span class="pill" style="margin-left:8px">${isOffDay?'Jour non travaillé':list.filter(due).length+'/'+list.length+' réalisées'}</span></summary><div class="list" style="margin-top:12px">${list.map(t=>`<div class="list-row"><div><strong>${esc(t.name)}</strong><div class="muted">${esc(t.area)} · Fréquence : ${esc(taskFrequency(t))}</div>${t.method?'<div class="muted">Produit / méthode : '+esc(t.method)+'</div>':''}${t.note?'<div class="muted">Consignes : '+esc(t.note)+'</div>':''}<div class="muted">Dernière réalisation : ${fmtDate(t.doneDate)}</div></div><div>${isOffDay?'<span class="pill">Jour non travaillé</span>':due(t)?'<span class="pill">Fait sur la période</span>':`<button class="small-btn" data-action="done-task" data-id="${t.id}">Marquer fait</button>`}</div></div>`).join('')}</div></details>`}).join('')}<div class="notice">Les réalisations sont archivées sur cet appareil et incluses dans les sauvegardes JSON. Les semaines précédentes ne peuvent afficher que les données effectivement enregistrées à ces dates.</div></div>`}
function printCleaningHistory(){const rows=(db.cleaningHistory||[]).slice().reverse();const w=window.open('','_blank');if(!w){toast('Autorisez les fenêtres surgissantes pour imprimer.');return}const body=rows.length?rows.map(r=>'<tr><td>'+esc(fmtDate(r.date))+'</td><td>'+esc(r.time||'—')+'</td><td>'+esc(r.taskName)+'</td><td>'+esc(r.area||'—')+'</td><td>'+esc(r.frequency||'—')+'</td><td>'+esc(r.performedBy||'—')+'</td><td>'+esc([r.result,r.note].filter(Boolean).join(' — ')||'—')+'</td></tr>').join(''):'<tr><td colspan="7">Aucune réalisation enregistrée depuis l’activation de cet historique.</td></tr>';w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Historique des nettoyages</title><style>body{font:14px Arial;margin:24px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #aaa;padding:6px;text-align:left}th{background:#eee}</style></head><body><h1>Historique des nettoyages — Cuisine Pro</h1><p>Document généré le '+new Date().toLocaleString('fr-FR')+'.</p><button onclick="window.print()">Imprimer / Enregistrer en PDF</button><table><thead><tr><th>Date</th><th>Heure</th><th>Tâche</th><th>Zone</th><th>Fréquence</th><th>Responsable</th><th>Résultat / remarque</th></tr></thead><tbody>'+body+'</tbody></table><p>Ce document reprend les réalisations enregistrées dans l’application. Vérifiez qu’il correspond à votre PMS et aux exigences applicables.</p></body></html>');w.document.close()}function trace(){const groups={};(db.lots||[]).forEach(l=>{const date=recordDate(l);const key=date?date.slice(0,7):'sans-date';if(!groups[key])groups[key]=[];groups[key].push(l)});const months=Object.keys(groups).sort((a,b)=>b.localeCompare(a));const current=today().slice(0,7);if(!groups[current])groups[current]=[];if(!months.includes(current))months.unshift(current);const monthLabel=key=>{if(key==='sans-date')return 'Sans date';const parts=key.split('-');return new Date(Number(parts[0]),Number(parts[1])-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}).replace(/^./,s=>s.toLocaleUpperCase())};return `${head('Traçabilité','Réceptions, lots et photos des étiquettes',btn('+ Enregistrer une réception','new-lot',true))}<div class="notice">Les réceptions sont regroupées par mois. Ouvre un mois pour retrouver les produits, numéros de lot, DLC/DDM et photos des étiquettes. Les photos sont conservées sur cet appareil.</div><div class="section"><div class="section-head"><h3>Historique des réceptions</h3><span class="pill">${(db.lots||[]).length} réception(s)</span></div>${months.map(key=>{const list=(groups[key]||[]).slice().sort((a,b)=>recordDate(b).localeCompare(recordDate(a)));return `<details class="card" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700;padding:4px 0">${esc(monthLabel(key))}<span class="pill" style="margin-left:8px">${list.length} produit(s)</span></summary><div class="table-wrap" style="margin-top:12px">${list.length?`<table class="data-table"><thead><tr><th>Réception</th><th>Produit</th><th>Fournisseur</th><th>N° lot</th><th>DLC / DDM</th><th>Qté</th><th>Photos</th></tr></thead><tbody>${list.map(l=>`<tr><td>${fmtDate(l.date)}</td><td><strong>${esc(l.product)}</strong></td><td>${esc(l.supplier||'—')}</td><td>${esc(l.batch||'—')}</td><td>${fmtDate(l.expiry)}</td><td>${esc(l.qty)} ${esc(l.unit)}</td><td><button class="small-btn" data-action="view-lot-photos" data-id="${l.id}">Voir photos</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucune réception enregistrée pour ce mois.</div>'}</div></details>`}).join('')}</div>`}
function isCatalogRecipe(r){return r.source==='catalog'||starter.recipes.some(x=>x.id===r.id)}
let premiumEntitlement=false;let premiumEntitlementChecked=false;let premiumEntitlementMessage='';
function isPremium(){return premiumEntitlement===true}
async function refreshPremiumEntitlement(){premiumEntitlement=false;premiumEntitlementChecked=false;premiumEntitlementMessage='';if(!supabaseClient||!cloudUser){premiumEntitlementChecked=true;return false}try{const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();if(sessionError||!sessionData.session){premiumEntitlementChecked=true;return false}const {data,error}=await supabaseClient.from('cuisine_pro_entitlements').select('tier,status,expires_at').eq('user_id',cloudUser.id).maybeSingle();if(error){premiumEntitlementMessage='Les droits Premium ne sont pas encore configurés côté serveur.';console.warn('Premium entitlement lookup failed',error);premiumEntitlementChecked=true;return false}const active=data&&data.tier==='premium'&&data.status==='active'&&(!data.expires_at||new Date(data.expires_at)>new Date());premiumEntitlement=Boolean(active);premiumEntitlementChecked=true;return premiumEntitlement}catch(e){console.warn('Premium entitlement unavailable',e);premiumEntitlementMessage='Impossible de vérifier l’abonnement. Les fonctions Premium restent verrouillées.';premiumEntitlementChecked=true;return false}}
function premiumNotice(feature){return '<div class="card" style="margin:16px 0"><h3 class="card-title">Cuisine Pro Premium</h3><p>Accède au catalogue de recettes Cuisine Pro et à la liste de courses pour <strong>4,99 € / mois</strong>.</p><p class="muted">'+esc(feature||'Fonctionnalité Premium')+'. '+esc(premiumEntitlementMessage||'Le paiement intégré Apple/Google est en préparation. Aucun paiement ne peut être effectué dans cette version.')+'</p><button class="btn primary" data-action="premium-info">Découvrir Premium</button></div>'}
function recipes(){const all=db.recipes||[],mine=all.filter(r=>!isCatalogRecipe(r)),catalog=all.filter(isCatalogRecipe),count=(db.finalShoppingRecipes||[]).length,savedCount=(db.savedShoppingLists||[]).length;return head('Mes recettes',mine.length+' recette(s) personnelle(s)',btn('+ Nouvelle recette','new-recipe',true))+'<div class="section form-actions"><button class="btn" data-action="show-catalog">Catalogue Premium ('+catalog.length+')</button><button class="btn" data-action="show-final-shopping">Liste de courses '+(isPremium()?'('+count+')':'· Premium')+'</button>'+(isPremium()?'<button class="btn" data-action="show-saved-shopping-lists">Mes listes validées ('+savedCount+')</button>':'')+'</div><p class="muted">Tes recettes personnelles restent accessibles dans l’offre gratuite. Le catalogue Cuisine Pro et la liste de courses sont réservés à Premium.</p><input class="search" id="recipeSearch" placeholder="Rechercher une recette, un ingrédient, une catégorie…" style="margin-bottom:14px"><div class="recipe-grid" id="recipeGrid">'+recipeCards(mine)+'</div>'}
function showCatalog(){const catalog=(db.recipes||[]).filter(isCatalogRecipe);const cards=catalog.map(r=>'<article class="recipe"><h3>'+esc(r.name)+'</h3><p>'+esc(r.category||'Sans catégorie')+' · Base '+Number(r.portions||1)+' portion(s)</p><div class="muted" style="margin-top:9px">'+(r.ingredients||[]).length+' ingrédient(s) · Allergènes : '+esc(r.allergens||'À renseigner')+'</div><div class="recipe-bottom"><button class="small-btn" data-action="view-recipe" data-id="'+esc(r.id)+'">Voir la recette</button><div class="recipe-actions"><button class="small-btn" data-action="add-catalog-to-mine" data-id="'+esc(r.id)+'">Ajouter à mes recettes</button><button class="small-btn" data-action="add-recipe-to-final-shopping" data-id="'+esc(r.id)+'">Ajouter aux courses</button></div></div></article>').join('');openModal('Catalogue Cuisine Pro · Premium',isPremium()?'<p class="muted">Ajoute les recettes à ton carnet ou à ta liste de courses.</p><div class="recipe-grid">'+cards+'</div>':'<div class="notice">Le catalogue de recettes est réservé à Cuisine Pro Premium.</div>'+premiumNotice('Accès au catalogue de recettes et à la liste de courses')+'<div class="list">'+catalog.slice(0,4).map(r=>'<div class="list-row"><div><strong>'+esc(r.name)+'</strong><div class="muted">'+esc(r.category||'Recette')+'</div></div><span class="pill">Premium</span></div>').join('')+'</div>')}
function recipeCards(list){if(!list.length)return '<div class="empty">Aucune recette correspondante.</div>';return list.map(r=>`<article class="recipe" data-action="view-recipe" data-id="${r.id}" role="button" tabindex="0" aria-label="Ouvrir la recette ${esc(r.name)}" style="cursor:pointer"><h3>${esc(r.name)} <span aria-hidden="true" style="font-size:12px;color:var(--green)">↗ Voir la recette</span></h3><p>${esc(r.category||'Sans catégorie')} · Base ${r.portions} portion(s)</p><div class="muted" style="margin-top:9px">${r.ingredients.length} ingrédient(s) · Allergènes : ${esc(r.allergens||'À renseigner')}</div><div class="recipe-bottom"><strong>${r.cost?esc(r.cost)+' € / portion':'Coût non renseigné'}</strong><div class="recipe-actions"><button class="small-btn" data-action="scale-recipe" data-id="${r.id}">Calculer</button><button class="small-btn" data-action="edit-recipe" data-id="${r.id}">Modifier</button><button class="small-btn" data-action="delete-recipe" data-id="${r.id}" style="color:var(--red)">Supprimer</button></div></div></article>`).join('')}
function production(){return `${head('Production','Planifier les préparations et calculer les quantités',btn('+ Planifier une production','new-production',true))}<div class="notice">Les quantités sont calculées à partir du grammage de base des fiches recettes. Vérifiez les rendements, pertes et unités avant utilisation en production.</div><div class="card"><h3 class="card-title">Calculateur rapide</h3><div class="field-grid"><div class="field"><label>Recette</label><select id="calcRecipe">${db.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>Nombre de portions souhaitées</label><input id="calcPortions" type="number" min="1" value="20"></div></div><div class="form-actions"><button class="btn primary" data-action="calculate">Calculer les quantités</button></div><div id="calcResult"></div></div><div class="section"><div class="section-head"><h3>Productions planifiées</h3></div><div class="table-wrap">${db.production.length?`<table class="data-table"><thead><tr><th>Date</th><th>Recette</th><th>Portions</th><th>Statut</th></tr></thead><tbody>${db.production.slice().reverse().map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc((db.recipes.find(r=>r.id===p.recipeId)||{}).name||'Recette supprimée')}</td><td>${p.portions}</td><td><span class="pill">${esc(p.status||'À préparer')}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aucune production planifiée.</div>'}</div></div>`}
function settings(){return `${head('Données & paramètres','Sauvegarde, restauration et synchronisation')}<div class="section card"><h3 class="card-title">Compte et synchronisation en ligne</h3><p class="muted">Connectez-vous pour synchroniser les données principales entre vos appareils. Lors de la première synchronisation, choisissez avec soin la source à conserver. Les photos de réception restent locales dans cette première version.</p><div class="field-grid"><div class="field"><label for="cloudEmail">E-mail</label><input id="cloudEmail" type="email" autocomplete="email" placeholder="vous@exemple.com"></div><div class="field"><label for="cloudPassword">Mot de passe</label><input id="cloudPassword" type="password" autocomplete="current-password" placeholder="Au moins 8 caractères"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" data-action="cloud-signup">Créer un compte</button><button class="btn" data-action="cloud-login">Se connecter</button><button class="btn" data-action="cloud-logout">Se déconnecter</button><button class="btn" data-action="cloud-sync">Synchroniser maintenant</button></div><p class="muted" id="cloudAccountStatus">${cloudUser?'Connecté : '+esc(cloudUser.email):'Non connecté'}</p><p class="muted">La création de compte peut nécessiter une confirmation par e-mail. Configurez l’URL de redirection Supabase sur l’adresse de votre application.</p></div><div class="notice warn">Les données sont enregistrées sur cet appareil. Exportez régulièrement une sauvegarde JSON et conservez-la ailleurs. Les relevés de température, les fiches de réception et leurs photos ne sont plus supprimés automatiquement. Exportez régulièrement une sauvegarde et définissez votre propre politique d’archivage selon les obligations applicables à votre établissement. La synchronisation multi-appareils n’est pas encore activée dans ce prototype.</div><div class="grid"><div class="card"><h3 class="card-title">Exporter une sauvegarde</h3><p class="muted">Télécharge recettes, contrôles, lots, tâches et productions en fichier JSON.</p><button class="btn primary" data-action="export">Exporter les données</button></div><div class="card"><h3 class="card-title">Restaurer une sauvegarde</h3><p class="muted">Importez un fichier JSON précédemment exporté par Cuisine Pro.</p><input type="file" id="importFile" accept="application/json,.json"></div><div class="card"><h3 class="card-title">Installation</h3><p class="muted">Sur navigateur compatible, utilisez le menu de partage ou du navigateur puis « Ajouter à l’écran d’accueil ». L’accès hors connexion dépend de l’installation et de la mise en cache.</p><span class="pill">Mode local</span></div></div><div class="section card"><h3 class="card-title">Périmètre sanitaire</h3><p class="muted">Cette version est un registre opérationnel de base, pas un PMS complet validé ni une certification de conformité. Complétez les procédures, dangers, limites critiques, surveillances, actions correctives, vérifications, responsabilités et enregistrements spécifiques à votre établissement. Vérifiez les exigences applicables auprès de votre DDPP ou de votre conseil HACCP.</p></div><div class="section">${btn('Effacer toutes les données locales','clear-data')}</div>`}
function openModal(title,body){document.getElementById('modalRoot').onclick=handleAction;document.getElementById('modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="modal"><div class="modal-head"><h3>${title}</h3><button class="xbtn" data-action="close-modal" aria-label="Fermer">×</button></div>${body}</section></div>`;document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()})}document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.action==='toggle-saved-shopping-item')toggleSavedShoppingItem(t.dataset.listId,t.dataset.itemId,t.checked)});function closeModal(){document.getElementById('modalRoot').innerHTML=''}function field(label,name,type='text',value='',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(label,name,options,value=''){return `<div class="field"><label>${label}</label><select name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}function formShell(id,fields,submit){return `<form id="${id}"><div class="field-grid">${fields}</div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">${submit||'Enregistrer'}</button></div></form>`}
function printRecipeShopping(id){const r=db.recipes.find(x=>x.id===id);if(!r)return;const w=window.open('','_blank');if(!w){alert('Autorise les fenêtres contextuelles pour imprimer la liste.');return}w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Liste de courses</title><style>body{font:15px Arial;margin:24px}li{padding:6px 0}</style></head><body><h2>Liste de courses — '+esc(r.name)+'</h2><p>Base : '+esc(r.portions)+' portion(s) · '+new Date().toLocaleDateString('fr-FR')+'</p><ul>'+r.ingredients.map(i=>'<li>☐ '+esc(i.name)+' — '+esc(i.qty)+' '+esc(i.unit)+'</li>').join('')+'</ul></body></html>');w.document.close();w.focus();w.print()}
function handleAction(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='close-modal')return closeModal();if(a==='go-hygiene')return go('hygiene');if(a==='show-catalog')return showCatalog();if(a==='add-catalog-to-mine'){if(!isPremium())return showCatalog();const source=db.recipes.find(r=>r.id===id&&isCatalogRecipe(r));if(!source)return;const copy=structuredClone(source);copy.id=uid();copy.source='custom';copy.name=source.name+' (ma fiche)';db.recipes.push(copy);save();showCatalog();toast('Copie personnelle ajoutée à tes recettes.');return;}if(a==='premium-info')return openModal('Cuisine Pro Premium',premiumNotice('Catalogue de recettes et liste de courses')+'<p class="muted">L’abonnement réel sera activé après intégration des achats intégrés Apple et Google. Aucun paiement ne peut être effectué dans cette version de préparation.</p>');if(a==='new-temp')return modalTemp();if(a==='new-lot')return modalLot();if(a==='view-lot-photos')return showLotPhotos(id);if(a==='new-task')return modalTask();if(a==='new-recipe')return modalRecipe();if(a==='view-recipe'&&e.target.closest('button')===null)return modalViewRecipe(db.recipes.find(r=>r.id===id));if(a==='edit-recipe'){const r=db.recipes.find(r=>r.id===id);if(r&&isCatalogRecipe(r)&&!isPremium())return showCatalog();return modalRecipe(r);}if(a==='delete-recipe'){const r=db.recipes.find(r=>r.id===id);if(r&&isCatalogRecipe(r)&&!isPremium())return showCatalog();return deleteRecipe(id);}if(a==='add-recipe-to-final-shopping'){if(!isPremium())return showCatalog();return addRecipeToFinalShopping(id);}if(a==='add-calculated-recipe-to-final-shopping'){if(!isPremium())return showCatalog();return addCalculatedRecipeToFinalShopping(id,b.dataset.portions);}if(a==='show-final-shopping')return isPremium()?showFinalShoppingList():showCatalog();if(a==='validate-final-shopping')return isPremium()?validateFinalShopping():showCatalog();if(a==='show-saved-shopping-lists'){if(!isPremium())return showCatalog();return showSavedShoppingLists();}if(a==='delete-saved-shopping-list'){if(!isPremium())return showCatalog();return deleteSavedShoppingList(id);}if(a==='open-saved-shopping-list'){if(!isPremium())return showCatalog();return openSavedShoppingList(id);}if(a==='add-item-to-saved-list'){if(!isPremium())return showCatalog();return addItemToSavedList(id);}if(a==='finish-saved-shopping-list'){if(!isPremium())return showCatalog();return finishSavedShoppingList(id);}if(a==='print-saved-shopping-list'){if(!isPremium())return showCatalog();return printSavedShoppingList(id);}if(a==='remove-final-shopping-recipe'){if(!isPremium())return showCatalog();return removeFinalShoppingRecipe(id);}if(a==='clear-final-shopping'){if(!isPremium())return showCatalog();return clearFinalShopping();}if(a==='print-final-shopping'){if(!isPremium())return showCatalog();return printFinalShopping();}if(a==='scale-recipe'){const r=db.recipes.find(r=>r.id===id);if(r&&isCatalogRecipe(r)&&!isPremium())return showCatalog();return modalScale(r);}if(a==='done-task'){const t=db.tasks.find(t=>t.id===id);if(t){const now=new Date();t.completedPeriods=t.completedPeriods||{};t.completedPeriods[taskPeriodKey(t)]=today();t.doneDate=today();db.cleaningHistory=Array.isArray(db.cleaningHistory)?db.cleaningHistory:[];db.cleaningHistory.push({id:uid(),taskId:t.id,taskName:t.name,area:t.area,frequency:taskFrequency(t),date:today(),time:now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),completedAt:now.toISOString(),performedBy:'',result:'Réalisé',note:''});save();render();toast('Réalisation enregistrée dans l’historique.')}return}if(a==='print-cleaning-history')return printCleaningHistory();if(a==='calculate')return calculate();if(a==='new-production')return modalProduction();if(a==='export')return exportData();if(a==='clear-data')return clearAllData();if(a==='cloud-signup')return cloudAuth('signup');if(a==='cloud-login')return cloudAuth('login');if(a==='cloud-logout')return cloudLogout();if(a==='cloud-sync')return cloudSync();}
async function clearAllData(){if(!confirm('Effacer définitivement toutes les données locales de Cuisine Pro sur cet appareil, y compris les photos de réception ? Cette action est irréversible.'))return;try{await new Promise((resolve,reject)=>{const req=indexedDB.deleteDatabase(PHOTO_DB);req.onsuccess=()=>resolve(true);req.onerror=()=>reject(req.error||new Error('Suppression des photos impossible'));req.onblocked=()=>reject(new Error('La base des photos est encore utilisée par un autre onglet. Ferme les autres onglets Cuisine Pro puis réessaie.'))});localStorage.removeItem(KEY);localStorage.removeItem('cuisinePro_lastBackupReminder');db={...structuredClone(starter),deletedStarterRecipeIds:[]};loadFailed=false;persistenceError=false;render();toast('Données locales et photos supprimées.')}catch(err){console.error('Effacement des données locales incomplet.',err);alert('Effacement incomplet : '+(err.message||'erreur de stockage')+'. Les données principales ont été conservées autant que possible. Ferme les autres onglets Cuisine Pro et réessaie.')}}
function modalTemp(){openModal('Nouveau relevé de température',formShell('tempForm',field('Date','date','date',today(),'required')+selectField('Type de contrôle','type',['Froid','Congélation','Réception','Cuisson à cœur','Refroidissement','Remise en température','Autre'],'Froid')+field('Équipement / produit','location','text','','required placeholder="Ex. Chambre froide positive"')+field('Température mesurée (°C)','value','number','','required step="0.1"')+field('Limite / référence PMS','limit','text','','placeholder="Référence validée dans votre PMS"')+`<div class="field full"><label>Observation / action corrective si nécessaire</label><textarea name="action" placeholder="Écart constaté, produit isolé, nouvelle mesure, décision et responsable…"></textarea></div>`,'Enregistrer le relevé'));document.getElementById('tempForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.temps.push({id:uid(),date:f.get('date'),type:f.get('type'),location:f.get('location'),value:f.get('value'),limit:f.get('limit'),action:f.get('action')});save();closeModal();render();toast('Relevé enregistré localement.') }}
function modalLot(){openModal('Enregistrer une réception',`<form id="lotForm"><div class="field-grid">${field('Date de réception','date','date',today(),'required')}${field('Produit','product','text','','required placeholder="Ex. Filet de truite"')}${field('Fournisseur','supplier')}${field('Numéro de lot','batch')}${field('DLC / DDM','expiry','date')}${field('Quantité','qty','number','','min="0" step="any"')}${selectField('Unité','unit',['kg','g','L','mL','pièce','colis'])}<div class="field full"><label>Photos des étiquettes (plusieurs possibles)</label><input name="photos" id="lotPhotos" type="file" accept="image/*" multiple><small class="muted">Sélectionnez les photos de votre photothèque. Elles seront conservées sur cet appareil.</small><div id="photoPreview" class="photo-list"></div></div><div class="field full"><label>Contrôles / remarques réception</label><textarea name="note" placeholder="Température, emballage, conformité, décision…"></textarea></div></div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">Enregistrer la réception</button></div></form>`);document.getElementById('lotPhotos').addEventListener('change',e=>{const p=document.getElementById('photoPreview');p.innerHTML='';Array.from(e.target.files).forEach(f=>{if(f.type.startsWith('image/')){const im=document.createElement('img');im.className='photo-thumb';im.alt=f.name;im.src=URL.createObjectURL(f);p.appendChild(im)}})});document.getElementById('lotForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),lot={id:uid(),date:f.get('date'),product:f.get('product'),supplier:f.get('supplier'),batch:f.get('batch'),expiry:f.get('expiry'),qty:f.get('qty'),unit:f.get('unit'),note:f.get('note')};try{await saveLotPhotos(lot.id,Array.from(document.getElementById('lotPhotos').files||[]));db.lots.push(lot);save();closeModal();render();toast('Réception et photos enregistrées sur cet appareil.')}catch(err){toast('Erreur de stockage des photos. Réessayez avec moins de photos.')}}}
function modalTask(){openModal('Ajouter une tâche de nettoyage',formShell('taskForm',field('Tâche','name','text','','required')+field('Zone / équipement','area','text','','required')+selectField('Fréquence','frequency',['Quotidien','Hebdomadaire','Mensuel'],'Quotidien')+field('Produit / méthode','method')+`<div class="field full"><label>Consignes et vérification</label><textarea name="note" placeholder="Produit utilisé, dosage selon étiquette, temps de contact, rinçage si requis…"></textarea></div>`,'Ajouter la tâche'));document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.tasks.push({id:uid(),name:f.get('name'),area:f.get('area'),frequency:f.get('frequency'),method:f.get('method'),note:f.get('note'),doneDate:'',completedPeriods:{}});save();closeModal();render();toast('Tâche ajoutée.') }}
function deleteRecipe(id){const r=db.recipes.find(x=>x.id===id);if(!r)return;if(!confirm('Supprimer définitivement la recette « '+r.name+' » ?'))return;const previous=structuredClone(db);db.deletedStarterRecipeIds=Array.isArray(db.deletedStarterRecipeIds)?db.deletedStarterRecipeIds:[];if(starter.recipes.some(base=>base.id===id)&&!db.deletedStarterRecipeIds.includes(id))db.deletedStarterRecipeIds.push(id);db.recipes=db.recipes.filter(x=>x.id!==id);db.production=(db.production||[]).filter(p=>p.recipeId!==id);db.finalShoppingRecipes=(db.finalShoppingRecipes||[]).filter(p=>p.recipeId!==id);if(!save()){db=previous;return}render();toast('Recette supprimée.')}
function modalRecipe(r){r=r||{id:'',name:'',category:'Plat',portions:10,ingredients:[],steps:'',allergens:'',notes:'',cost:''};const ing=r.ingredients.map(i=>`${i.name}|${i.qty}|${i.unit}`).join('\n');openModal(r.id?'Modifier la recette':'Nouvelle recette',`<form id="recipeForm"><div class="field-grid">${field('Nom de la recette','name','text',r.name,'required')}${selectField('Catégorie','category',['Entrée','Poisson','Viande','Végétarien','Accompagnement','Sauce / base','Dessert','Pâtisserie','Autre'],r.category)}${field('Portions de référence','portions','number',r.portions,'required min="1"')}${field('Coût matière par portion (€)','cost','number',r.cost,'min="0" step="0.01"')}</div><div class="field" style="margin-top:13px"><label>Ingrédients — une ligne par ingrédient : nom | quantité | unité</label><textarea name="ingredients" required style="min-height:130px" placeholder="Carottes | 1.5 | kg&#10;Crème | 0.2 | L">${esc(ing)}</textarea><small class="muted">Utilisez un point pour les décimales. Gardez des unités cohérentes pour les calculs.</small></div><div class="field" style="margin-top:13px"><label>Étapes de réalisation</label><textarea name="steps">${esc(r.steps)}</textarea></div><div class="field" style="margin-top:13px"><label>Allergènes à déclarer (à vérifier à partir des ingrédients et étiquettes)</label><input name="allergens" value="${esc(r.allergens)}"></div><div class="field" style="margin-top:13px"><label>Notes, rendement, conservation, mise en place</label><textarea name="notes">${esc(r.notes)}</textarea></div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">Enregistrer la recette</button></div></form>`);document.getElementById('recipeForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);let ingredients=[];for(const line of f.get('ingredients').split('\n').map(x=>x.trim()).filter(Boolean)){const parts=line.split('|').map(x=>x.trim());if(parts.length<3||!parts[0]||!Number.isFinite(Number(parts[1]))){toast('Format ingrédient invalide. Utilisez : nom | quantité | unité');return}ingredients.push({name:parts[0],qty:Number(parts[1]),unit:parts.slice(2).join('|')})}const obj={id:r.id||uid(),source:r.source||'custom',name:f.get('name'),category:f.get('category'),portions:Number(f.get('portions')),cost:f.get('cost'),ingredients,steps:f.get('steps'),allergens:f.get('allergens'),notes:f.get('notes')};if(r.id)db.recipes=db.recipes.map(x=>x.id===r.id?obj:x);else db.recipes.push(obj);save();closeModal();render();toast('Recette enregistrée.') }}
function modalViewRecipe(r){if(!r)return;const shopping=r.ingredients&&r.ingredients.length?`<div class="section"><h4>Liste de courses de cette recette</h4><div class="recipe-ingredient-list">${r.ingredients.map(i=>`<div class="recipe-ingredient-row"><span class="recipe-ingredient-name">${esc(i.name)}</span><span class="recipe-ingredient-qty">${esc(i.qty)} ${esc(i.unit)}</span></div>`).join('')}</div><div class="form-actions"><button class="btn primary" data-action="add-recipe-to-final-shopping" data-id="${esc(r.id)}">Ajouter à la liste finale</button></div></div>`:'<div class="notice">Ajoute des ingrédients à cette fiche pour créer sa liste de courses.</div>';openModal(esc(r.name),`<div class="muted">${esc(r.category||'Sans catégorie')} · Base ${r.portions} portion(s)</div><div class="section"><h4>Ingrédients de la recette</h4><ul class="recipe-ingredient-list">${r.ingredients.map(i=>`<li class="recipe-ingredient-row"><span class="recipe-ingredient-name">- ${esc(i.name)}</span><span class="recipe-ingredient-qty">${esc(i.qty)} ${esc(i.unit)}</span></li>`).join('')}</ul></div><div class="section"><h4>Étapes de réalisation</h4><p style="white-space:pre-wrap">${esc(r.steps||'À renseigner')}</p></div><div class="section"><h4>Allergènes</h4><p>${esc(r.allergens||'À vérifier')}</p></div>${r.notes?`<div class="section"><h4>Notes</h4><p style="white-space:pre-wrap">${esc(r.notes)}</p></div>`:''}${shopping}<div class="form-actions"><button class="btn" data-action="close-modal">Fermer</button><button class="btn" data-action="scale-recipe" data-id="${r.id}">Calculer les quantités</button><button class="btn primary" data-action="edit-recipe" data-id="${r.id}">Modifier</button></div>`)}
function addRecipeToFinalShopping(id){const r=db.recipes.find(x=>x.id===id);if(!r)return;db.finalShoppingRecipes=Array.isArray(db.finalShoppingRecipes)?db.finalShoppingRecipes:[];if(db.finalShoppingRecipes.some(x=>x.recipeId===id)){toast('Cette recette est déjà dans la liste finale.');return}db.finalShoppingRecipes.push({recipeId:r.id,name:r.name,portions:Number(r.portions)||1,ingredients:structuredClone(r.ingredients||[])});save();toast('Recette ajoutée à la liste finale.');}
function addCalculatedRecipeToFinalShopping(id,portionsValue){const r=db.recipes.find(x=>x.id===id),portions=Number(portionsValue);if(!r||!Number.isFinite(portions)||portions<1){toast('Nombre de portions invalide.');return}const factor=portions/(Number(r.portions)||1);db.finalShoppingRecipes=Array.isArray(db.finalShoppingRecipes)?db.finalShoppingRecipes:[];db.finalShoppingRecipes.push({recipeId:r.id+'-calc-'+uid(),sourceRecipeId:r.id,name:r.name+' ('+portions+' portions)',portions,ingredients:(r.ingredients||[]).map(i=>({...structuredClone(i),qty:Number(i.qty)*factor}))});save();toast('Recette calculée ajoutée à la liste finale.')}

function shoppingCategory(name){const n=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(/alcool|calvados|rhum|vin blanc|vin rouge|vin jaune|porto|cognac|armagnac|kirsch|liqueur|biere|bière|cidre|vodka|gin|whisky|champagne/.test(n))return 'Alcools & boissons';if(/boeuf|veau|porc|agneau|poulet|volaille|canard|dinde|jambon|lard|bacon|saucisse|chorizo|viande|foie|steak|rumsteck|paleron/.test(n))return 'Viandes & charcuterie';if(/poisson|truite|saumon|cabillaud|morue|thon|sardine|maquereau|moule|coquille|saint.?jacques|crevette|crabe|homard|calamar|encornet|fruits de mer/.test(n))return 'Poissons & produits de la mer';if(/pain|baguette|brioche|croissant|viennoiserie|pate feuilletee|pate brisee|feuilletage|wrap|tortilla|pain de mie/.test(n))return 'Pain & viennoiseries';if(/lait|creme|fromage|comte|emmental|parmesan|mozzarella|ricotta|mascarpone|philadelphia|chevre|yaourt|oeuf|feta|roquefort|beurre/.test(n))return 'Crèmerie';if(/farine|sucre|riz|spaghetti|pate|semoule|lentille|pois chiche|haricot rouge|levure|chocolat|cacao|vanille|huile|vinaigre|sel|poivre|epice|paprika|cumin|curry|moutarde|miel|sirop|noix|amande|noisette|cacahuete|pistache|biscuit|chapelure|bouillon|conserve|cannelle|raisin sec|raisin de corinthe|poudre d|farine|beurre de cacahuete/.test(n))return 'Épicerie & produits secs';if(/pomme|poire|banane|citron|orange|pamplemousse|fraise|framboise|myrtille|fruit|tomate|carotte|oignon|echalote|ail|poireau|brocoli|courgette|aubergine|poivron|salade|roquette|epinard|champignon|persil|coriandre|basilic|thym|romarin|ciboulette|pomme de terre|patate|chou|haricot vert|concombre|avocat|legume/.test(n))return 'Fruits & légumes';if(/surgele|glace/.test(n))return 'Surgelés';return 'Autres produits'}
function normalizeShoppingName(name){let n=String(name||'Ingrédient à préciser').trim().toLocaleLowerCase('fr-FR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s*\([^)]*\)\s*/g,' ').replace(/\s+/g,' ').trim();n=n.replace(/^(farine|beurre|sucre|huile|creme|raisins? de corinthe|raisins? secs?)\s+(?:pour la |pour le |de la |du |de l'|de )?(pate brisee|garniture|recette|la sauce)$/,'$1');if(/^beurre(?:\s+(?:mou|clarifie|fondu|pommade|demi-sel|doux|sale|ramolli))?$/.test(n))return 'beurre';if(/^beurre de cacahuete(?:s)?$/.test(n))return 'beurre de cacahuète';if(/^farine(?:\s+.+)?$/.test(n))return 'farine';if(/^sucre(?:\s+(?:glace|en poudre|semoule|cristallise))?$/.test(n))return 'sucre';if(/^raisin(?:s)?(?:\s+de corinthe|\s+secs?)?$/.test(n))return 'raisins secs';if(/^huile(?:\s+d olive)?$/.test(n))return 'huile';if(/^oeuf(?:s)?(?:\s+entier(?:s)?)?$/.test(n))return 'œufs';if(/^jaune d oeuf$/.test(n))return 'jaune d’œuf';if(/^pommes? golden$/.test(n))return 'pommes Golden';if(/^parmesan(?: rape)?$/.test(n))return 'parmesan';return n.charAt(0).toLocaleUpperCase('fr-FR')+n.slice(1)}function shoppingUnit(unit){const u=String(unit||'').trim().toLocaleLowerCase('fr-FR');if(['g','gramme','grammes'].includes(u))return 'g';if(['kg','kilo','kilos','kilogramme','kilogrammes'].includes(u))return 'kg';if(['ml','millilitre','millilitres'].includes(u))return 'ml';if(['l','litre','litres'].includes(u))return 'l';if(['piece','pièce','pieces','pièces','unité','unites','unités'].includes(u))return 'pièce(s)';return String(unit||'').trim()}function finalShoppingGroups(){const groups={};for(const r of db.finalShoppingRecipes||[]){for(const i of r.ingredients||[]){const originalName=String(i.name||'Ingrédient à préciser').trim(),name=normalizeShoppingName(originalName),unit=shoppingUnit(i.unit),qty=Number(i.qty),category=shoppingCategory(name),key=name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('fr-FR')+'|'+unit.toLocaleLowerCase('fr-FR');groups[category]=groups[category]||{};if(!groups[category][key])groups[category][key]={name,unit,qty,valid:Number.isFinite(qty)};else if(groups[category][key].valid&&Number.isFinite(qty))groups[category][key].qty+=qty;else groups[category][key].valid=false}}const order=['Fruits & légumes','Pain & viennoiseries','Crèmerie','Viandes & charcuterie','Poissons & produits de la mer','Épicerie & produits secs','Alcools & boissons','Surgelés','Autres produits'];return order.filter(c=>groups[c]).map(category=>({category,items:Object.values(groups[category]).sort((a,b)=>a.name.localeCompare(b.name,'fr'))}))}
function showFinalShoppingList(){const recipes=db.finalShoppingRecipes||[],groups=finalShoppingGroups();openModal('Liste finale des courses',`<div class="section"><h4>Recettes ajoutées</h4>${recipes.length?'<div class="list">'+recipes.map(r=>'<div class="list-row"><span>'+esc(r.name)+'<div class="muted">Base '+esc(r.portions)+' portion(s)</div></span><button class="small-btn" data-action="remove-final-shopping-recipe" data-id="'+esc(r.recipeId)+'">Retirer</button></div>').join('')+'</div>':'<p class="muted">Aucune recette ajoutée pour le moment.</p>'}</div><div class="section"><h4>Liste de courses classée par rayon</h4>${groups.length?groups.map(g=>'<div class="section"><h4>'+esc(g.category)+'</h4><div class="list">'+g.items.map(i=>'<div class="list-row"><span>'+esc(i.name)+'</span><strong>'+(i.valid?i.qty.toLocaleString('fr-FR',{maximumFractionDigits:3})+' ':'Quantité à vérifier ')+esc(i.unit)+'</strong></div>').join('')+'</div></div>').join(''):'<p class="muted">Ajoute des recettes pour générer la liste.</p>'}</div><div class="form-actions"><button class="btn" data-action="close-modal">Fermer</button><button class="btn" data-action="clear-final-shopping">Vider la liste</button><button class="btn" data-action="print-final-shopping" ${groups.length?'':'disabled'}>Imprimer</button><button class="btn primary" data-action="validate-final-shopping" ${groups.length?'':'disabled'}>Valider et enregistrer</button></div>`)}
function validateFinalShopping(){const groups=finalShoppingGroups();if(!groups.length){toast('La liste est vide.');return}const name=prompt('Nom de cette liste de courses :','Courses du '+new Date().toLocaleDateString('fr-FR'));if(name===null)return;db.savedShoppingLists=Array.isArray(db.savedShoppingLists)?db.savedShoppingLists:[];db.savedShoppingLists.unshift({id:uid(),name:name.trim()||('Courses du '+new Date().toLocaleDateString('fr-FR')),createdAt:new Date().toISOString(),status:'active',items:groups.flatMap(g=>g.items.map(i=>({id:uid(),category:g.category,name:i.name,qty:i.qty,unit:i.unit,valid:i.valid,checked:false}))),recipes:(db.finalShoppingRecipes||[]).map(r=>r.name)});db.finalShoppingRecipes=[];save();closeModal();render();toast('Liste validée et enregistrée.')}function showSavedShoppingLists(){db.savedShoppingLists=Array.isArray(db.savedShoppingLists)?db.savedShoppingLists:[];openModal('Mes listes de courses',db.savedShoppingLists.length?'<div class="list">'+db.savedShoppingLists.map(l=>'<div class="list-row"><span><strong>'+esc(l.name)+'</strong><div class="muted">'+new Date(l.createdAt).toLocaleDateString('fr-FR')+' · '+(l.status==='done'?'Terminée':(l.items||[]).filter(i=>!i.checked).length+' article(s) restants')+'</div></span><div class="form-actions"><button class="btn primary" data-action="open-saved-shopping-list" data-id="'+esc(l.id)+'">Ouvrir</button><button class="btn danger" data-action="delete-saved-shopping-list" data-id="'+esc(l.id)+'">Supprimer</button></div></div>').join('')+'</div>':'<p class="muted">Aucune liste enregistrée. Prépare une liste finale puis valide-la.</p>')}function deleteSavedShoppingList(id){const l=(db.savedShoppingLists||[]).find(x=>x.id===id);if(!l)return;if(!confirm('Supprimer définitivement la liste « '+l.name+' » ?'))return;db.savedShoppingLists=db.savedShoppingLists.filter(x=>x.id!==id);save();showSavedShoppingLists();toast('Liste supprimée.')}function openSavedShoppingList(id){const l=(db.savedShoppingLists||[]).find(x=>x.id===id);if(!l)return;const order=['Fruits & légumes','Pain & viennoiseries','Crèmerie','Viandes & charcuterie','Poissons & produits de la mer','Épicerie & produits secs','Alcools & boissons','Surgelés','Autres produits'];const remaining=(l.items||[]).filter(i=>!i.checked).length;const body='<div class="section"><p class="muted">Coche chaque article quand tu l’as pris. La progression est enregistrée automatiquement.</p><div class="form-actions"><button class="btn primary" data-action="add-item-to-saved-list" data-id="'+esc(l.id)+'">+ Ajouter un produit oublié</button></div></div>'+order.filter(c=>(l.items||[]).some(i=>i.category===c)).map(c=>'<div class="section"><h4>'+esc(c)+'</h4><div class="list">'+l.items.filter(i=>i.category===c).map(i=>'<div class="list-row"><label style="display:flex;align-items:center;gap:10px;flex:1"><input type="checkbox" '+(i.checked?'checked':'')+' data-action="toggle-saved-shopping-item" data-list-id="'+esc(l.id)+'" data-item-id="'+esc(i.id)+'"><span style="'+(i.checked?'text-decoration:line-through;opacity:.55':'')+'">'+esc(i.name)+'</span></label><strong>'+(i.valid?i.qty.toLocaleString('fr-FR',{maximumFractionDigits:3})+' ':'')+esc(i.unit)+'</strong></div>').join('')+'</div></div>').join('')+'<div class="form-actions"><button class="btn" data-action="show-saved-shopping-lists">Retour aux listes</button><button class="btn" data-action="print-saved-shopping-list" data-id="'+esc(l.id)+'">Imprimer</button><button class="btn primary" data-action="finish-saved-shopping-list" data-id="'+esc(l.id)+'">'+(remaining?'Terminer la liste':'Marquer comme terminée')+'</button></div>';openModal(l.name+' ('+remaining+' restant(s))',body)}
function addItemToSavedList(id){const l=(db.savedShoppingLists||[]).find(x=>x.id===id);if(!l)return;const name=prompt('Quel produit veux-tu ajouter ?');if(name===null||!name.trim())return;const qtyText=prompt('Quantité (facultatif, par exemple 250) :','');if(qtyText===null)return;const unit=prompt('Unité (facultatif, par exemple g, kg, pièce, bouteille) :','');if(unit===null)return;const cleanName=name.trim();const normalized=normalizeShoppingName(cleanName);const cleanUnit=shoppingUnit(unit);const category=shoppingCategory(normalized);const numeric=qtyText.trim()===''?NaN:Number(qtyText.replace(',','.'));const key=normalized.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLocaleLowerCase('fr-FR')+'|'+cleanUnit.toLocaleLowerCase('fr-FR');const existing=(l.items||[]).find(x=>x.name.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLocaleLowerCase('fr-FR')+'|'+String(x.unit||'').toLocaleLowerCase('fr-FR')===key);if(existing&&Number.isFinite(numeric)&&existing.valid&&String(existing.unit||'').toLocaleLowerCase('fr-FR')===cleanUnit.toLocaleLowerCase('fr-FR')){existing.qty+=numeric;existing.checked=false}else{l.items=l.items||[];l.items.push({id:uid(),category,name:normalized,qty:numeric,unit:cleanUnit,valid:Number.isFinite(numeric),checked:false})}if(l.status==='done')l.status='active';save();openSavedShoppingList(id);toast('Produit ajouté à la liste.')}
function toggleSavedShoppingItem(listId,itemId,checked){const l=(db.savedShoppingLists||[]).find(x=>x.id===listId);const i=l&&l.items.find(x=>x.id===itemId);if(!i)return;i.checked=checked;save();openSavedShoppingList(listId)}function finishSavedShoppingList(id){const l=(db.savedShoppingLists||[]).find(x=>x.id===id);if(!l)return;if(l.items.some(i=>!i.checked)){if(!confirm('Il reste des articles non cochés. Marquer quand même cette liste comme terminée ?'))return}l.status='done';l.completedAt=new Date().toISOString();save();showSavedShoppingLists()}function printSavedShoppingList(id){const l=(db.savedShoppingLists||[]).find(x=>x.id===id);if(!l)return;const w=window.open('','_blank');if(!w){alert('Autorise les fenêtres contextuelles pour imprimer.');return}const order=['Fruits & légumes','Pain & viennoiseries','Crèmerie','Viandes & charcuterie','Poissons et produits de la mer','Épicerie & produits secs','Alcools & boissons','Surgelés','Autres produits'];w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>'+esc(l.name)+'</title><style>body{font:14px Arial;margin:24px}h2{margin-top:20px}li{padding:4px 0}</style></head><body><h1>'+esc(l.name)+'</h1>'+order.filter(c=>l.items.some(i=>i.category===c)).map(c=>'<h2>'+esc(c)+'</h2><ul>'+l.items.filter(i=>i.category===c).map(i=>'<li>'+ (i.checked?'✓':'☐')+' '+esc(i.name)+' — '+(i.valid?i.qty:'')+' '+esc(i.unit)+'</li>').join('')+'</ul>').join('')+'</body></html>');w.document.close();w.focus();w.print()}

function modalScale(r){if(!r)return;openModal('Calcul des quantités',`<div class="field"><label>Nombre de portions souhaitées</label><input id="scaleN" type="number" min="1" value="${r.portions}" required></div><div class="form-actions"><button class="btn primary" data-action="scale-show" data-id="${r.id}">Calculer</button></div><div id="scaleResult" style="margin-top:16px"></div>`);document.querySelector('[data-action="scale-show"]').onclick=()=>{const n=Number(document.getElementById('scaleN').value);if(!n||n<1)return;document.getElementById('scaleResult').innerHTML=scaleHtml(r,n)}}function scaleHtml(r,n){const f=n/r.portions;return `<p class="muted">${n} portions · coefficient ×${f.toLocaleString('fr-FR',{maximumFractionDigits:3})}</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Ingrédient</th><th>Quantité calculée</th></tr></thead><tbody>${r.ingredients.map(i=>`<tr><td>${esc(i.name)}</td><td>${(i.qty*f).toLocaleString('fr-FR',{maximumFractionDigits:3})} ${esc(i.unit)}</td></tr>`).join('')}</tbody></table></div><h4>Étapes</h4><p>${esc(r.steps||'À renseigner')}</p><h4>Allergènes déclarés dans la fiche</h4><p>${esc(r.allergens||'À vérifier')}</p><p class="muted">Vérifiez rendements, pertes, unités et allergènes avant production.</p><div class="section"><h4>Liste de courses pour ${n} portion(s)</h4><p class="muted">Les quantités calculées ci-dessus seront ajoutées à ta liste finale de courses.</p><button class="btn primary" data-action="add-calculated-recipe-to-final-shopping" data-id="${esc(r.id)}" data-portions="${n}">Ajouter à la liste finale</button></div>`}
function calculate(){const id=document.getElementById('calcRecipe')?.value;const n=Number(document.getElementById('calcPortions')?.value);const r=db.recipes.find(x=>x.id===id);const out=document.getElementById('calcResult');if(!r||!n||n<1){out.innerHTML='<p class="muted">Sélectionnez une recette et un nombre de portions valide.</p>';return}out.innerHTML=scaleHtml(r,n)}function modalProduction(){openModal('Planifier une production',formShell('prodForm',selectField('Recette','recipeId',db.recipes.map(r=>r.name))+field('Date prévue','date','date',today(),'required')+field('Nombre de portions','portions','number','10','required min="1"')+selectField('Statut','status',['À préparer','En cours','Terminé'])+`<div class="field full"><label>Notes de production</label><textarea name="notes"></textarea></div>`,'Planifier'));document.getElementById('prodForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const recipe=db.recipes.find(r=>r.name===f.get('recipeId'));if(!recipe)return;db.production.push({id:uid(),recipeId:recipe.id,date:f.get('date'),portions:Number(f.get('portions')),status:f.get('status'),notes:f.get('notes')});save();closeModal();render();toast('Production planifiée.')}}
function blobToDataURL(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob)})}
function dataURLToBlob(url){const parts=url.split(',');const match=parts[0].match(/data:(.*?);base64/);if(!match)throw Error('Photo invalide');const binary=atob(parts[1]);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:match[1]||'application/octet-stream'})}
function sixMonthCutoff(){const d=new Date();const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()-6);const lastDay=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,lastDay));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function recordDate(r){return String(r.date||r.receivedAt||r.createdAt||'').slice(0,10)}async function purgeExpiredRecords(){/* Conservation volontaire des preuves HACCP : aucune suppression automatique des relevés, réceptions ou photos. L’utilisateur gère l’archivage et les exports. */return false}async function allStoredPhotos(){const d=await openPhotoDB();try{return await new Promise((resolve,reject)=>{const req=d.transaction('photos','readonly').objectStore('photos').getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)})}finally{d.close()}}
async function replaceStoredPhotos(photos){const records=(photos||[]).filter(p=>p&&p.id&&p.lotId&&p.dataUrl).map(p=>({id:p.id,lotId:p.lotId,name:p.name||'photo',blob:dataURLToBlob(p.dataUrl)}));const d=await openPhotoDB();try{await new Promise((resolve,reject)=>{const tx=d.transaction('photos','readwrite'),st=tx.objectStore('photos');st.clear();records.forEach(p=>st.put(p));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Transaction annulée'))})}finally{d.close()}}
async function exportData(){try{const photos=await allStoredPhotos();const photoData=[];for(const p of photos){photoData.push({id:p.id,lotId:p.lotId,name:p.name||'photo',dataUrl:await blobToDataURL(p.blob)})}const payload={version:2,exportedAt:new Date().toISOString(),data:db,photos:photoData};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='cuisine-pro-sauvegarde-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Sauvegarde exportée avec '+photoData.length+' photo(s).')}catch(err){console.error(err);toast('Export impossible. Vérifiez l’espace disponible et réessayez.')}}

let cloudSaveTimer=null,cloudSaveBusy=false;
function queueCloudSave(){if(!cloudUser||!supabaseClient||!cloudReady)return;if(cloudSaveTimer)clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(async()=>{if(cloudSaveBusy)return;cloudSaveBusy=true;try{const {error}=await supabaseClient.from('cuisine_pro_data').upsert({user_id:cloudUser.id,payload:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;updateStatus()}catch(e){console.warn('Automatic cloud save failed',e);const el=document.getElementById('connectionStatus');if(el)el.textContent='● Erreur de synchronisation · local conservé'}finally{cloudSaveBusy=false}},1200)}
async function restoreCloudSession(){if(!supabaseClient)return;try{const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;cloudUser=data.session?.user||null;await refreshPremiumEntitlement();supabaseClient.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;refreshPremiumEntitlement().then(()=>{updateStatus();render()});updateStatus();if(page==='settings')render()});updateStatus()}catch(e){console.warn('Session Supabase non restaurée',e)}}
async function cloudAuth(mode){
 if(!supabaseClient){alert('Le client Supabase ne s’est pas chargé. Vérifiez la connexion internet puis rechargez l’application.');return}
 const email=(document.getElementById('cloudEmail')?.value||'').trim();

 if(!email||!password){alert('Saisissez votre e-mail et votre mot de passe.');return}
 if(mode==='signup'&&password.length<8){alert('Choisissez un mot de passe d’au moins 8 caractères.');return}
 try{
  const result=mode==='signup'?await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await supabaseClient.auth.signInWithPassword({email,password});
  if(result.error)throw result.error;

  updateStatus();render();
 }catch(e){console.error(e);alert('Connexion Supabase impossible : '+(e.message||'erreur inconnue'))}
}

async function cloudSync(){
 if(!supabaseClient||!cloudUser){alert('Connectez-vous d’abord à votre compte Cuisine Pro.');return}
 if(!confirm('Avant la synchronisation, exportez une sauvegarde JSON depuis cette page. Continuer ?'))return;
 try{
  // Refresh the session and obtain the authenticated user from Supabase itself.
  const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
  if(sessionError)throw sessionError;
  if(!sessionData.session){cloudUser=null;cloudReady=false;updateStatus();throw new Error('La session a expiré. Reconnectez-vous puis réessayez.')}
  const {data:userData,error:userError}=await supabaseClient.auth.getUser();
  if(userError)throw userError;
  if(!userData.user){cloudUser=null;cloudReady=false;updateStatus();throw new Error('Supabase ne reconnaît pas de compte connecté. Déconnectez-vous puis reconnectez-vous.')}
  cloudUser=userData.user;
  const authenticatedUserId=userData.user.id;
  updateStatus();
  const {data:remote,error}=await supabaseClient.from('cuisine_pro_data').select('payload,updated_at').eq('user_id',authenticatedUserId).maybeSingle();
  if(error)throw error;
  if(!remote){
   const {error:insertError}=await supabaseClient.from('cuisine_pro_data').insert({user_id:authenticatedUserId,payload:db});
   if(insertError)throw insertError;
   cloudReady=true;toast('Données locales envoyées vers le cloud.');return;
  }
  const choice=prompt('Des données existent déjà dans le cloud. Tapez LOCAL pour remplacer le cloud par les données de cet appareil, ou CLOUD pour remplacer les données locales par celles du cloud. Annulez pour ne rien changer.');
  if(!choice)return;
  if(choice.trim().toUpperCase()==='LOCAL'){
   const {error:upError}=await supabaseClient.from('cuisine_pro_data').update({payload:db,updated_at:new Date().toISOString()}).eq('user_id',authenticatedUserId);
   if(upError)throw upError;cloudReady=true;toast('Données locales envoyées vers le cloud.');
  }else if(choice.trim().toUpperCase()==='CLOUD'){
   const incoming=remote.payload;
   if(!incoming||!Array.isArray(incoming.recipes)||!Array.isArray(incoming.temps)||!Array.isArray(incoming.lots)||!Array.isArray(incoming.tasks))throw new Error('Les données cloud ne sont pas dans le format Cuisine Pro attendu.');
   localStorage.setItem(KEY,JSON.stringify(incoming));db=incoming;loadFailed=false;persistenceError=false;cloudReady=true;render();toast('Données cloud chargées sur cet appareil.');
  }else alert('Choix non reconnu. Aucune donnée modifiée.');
 }catch(e){console.error(e);alert('Synchronisation impossible : '+(e.message||'erreur inconnue')+'. Vérifiez que le script SQL Cuisine Pro a bien été exécuté dans Supabase.')}
}

function remindBackup(){const key='cuisinePro_lastBackupReminder';const last=localStorage.getItem(key);const now=Date.now();if(!last||now-Number(last)>7*24*60*60*1000){setTimeout(()=>{if(confirm('Pensez à exporter une sauvegarde JSON de Cuisine Pro pour conserver une copie de vos preuves HACCP et de vos données. Voulez-vous ouvrir les données et paramètres ?'))go('settings');localStorage.setItem(key,String(now))},1200)}}
document.addEventListener('input',e=>{if(e.target.id==='recipeSearch'){const q=e.target.value.toLowerCase();const list=db.recipes.filter(r=>!isCatalogRecipe(r)&&[r.name,r.category,r.allergens,...r.ingredients.map(i=>i.name)].join(' ').toLowerCase().includes(q));const grid=document.getElementById('recipeGrid');if(grid)grid.innerHTML=recipeCards(list)}});document.addEventListener('change',e=>{if(e.target.id!=='importFile')return;const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=async()=>{let previousRaw=null;let localWriteDone=false;let previousPhotos=null;let photosReplaceStarted=false;try{const x=JSON.parse(reader.result);const incoming=x.data||x;if(!incoming||!Array.isArray(incoming.recipes)||!Array.isArray(incoming.temps)||!Array.isArray(incoming.lots)||!Array.isArray(incoming.tasks))throw new Error('La structure du fichier ne correspond pas à une sauvegarde Cuisine Pro.');if(x.photos!==undefined&&!Array.isArray(x.photos))throw new Error('La liste des photos est invalide.');if(Array.isArray(x.photos)){for(const p of x.photos){if(!p||!p.id||!p.lotId||typeof p.dataUrl!=='string'||!p.dataUrl.startsWith('data:image/'))throw new Error('Une photo de la sauvegarde est invalide.')}}const hasPhotoBackup=Array.isArray(x.photos);const confirmText='Remplacer les données actuelles par cette sauvegarde ?'+(hasPhotoBackup?' Les '+x.photos.length+' photo(s) du fichier remplaceront les photos actuelles.':' Cette ancienne sauvegarde ne contient pas de photos : les photos actuellement présentes seront conservées, mais certaines pourraient ne plus être reliées aux réceptions restaurées.');if(!confirm(confirmText))return;const restored={...structuredClone(starter),...incoming,deletedStarterRecipeIds:Array.isArray(incoming.deletedStarterRecipeIds)?incoming.deletedStarterRecipeIds:[]};previousRaw=localStorage.getItem(KEY);localStorage.setItem(KEY,JSON.stringify(restored));localWriteDone=true;if(hasPhotoBackup){previousPhotos=await Promise.all((await allStoredPhotos()).map(async p=>({id:p.id,lotId:p.lotId,name:p.name||'photo',dataUrl:await blobToDataURL(p.blob)})));photosReplaceStarted=true;await replaceStoredPhotos(x.photos)}db=restored;loadFailed=false;persistenceError=false;updateStatus();render();toast('Sauvegarde restaurée'+(hasPhotoBackup?' avec '+x.photos.length+' photo(s)':' ; photos locales conservées')+'.')}catch(err){console.error('Échec de restauration Cuisine Pro.',err);if(localWriteDone){try{if(previousRaw===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,previousRaw)}catch(rollbackError){console.error('Échec du retour arrière après restauration.',rollbackError)}}if(photosReplaceStarted){try{await replaceStoredPhotos(previousPhotos||[])}catch(photoRollbackError){console.error('Échec du retour arrière des photos après restauration.',photoRollbackError)}}alert('Sauvegarde non restaurée : '+(err.message||'fichier invalide ou espace insuffisant')+'. Les données précédentes ont été restaurées dans la mesure où le navigateur a permis le retour arrière.')}};reader.onerror=()=>alert('Impossible de lire le fichier de sauvegarde.');reader.readAsText(file)});
if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}render();restoreCloudSession();remindBackup();
</script></body></html>
