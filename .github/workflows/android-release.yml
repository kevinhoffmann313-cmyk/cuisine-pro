name: Préparer Cuisine Pro pour Google Play

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'confidentialite.html'
      - 'conditions.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  android-release:
    name: Compiler le bundle Android signé (.aab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm install

      - name: Préparer les fichiers web
        run: npm run prepare:web

      - name: Générer et synchroniser le projet Android
        run: |
          npm run cap:add:android
          npm run cap:sync

      - name: Vérifier les secrets de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Secret manquant : ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Secret manquant : ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Secret manquant : ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Secret manquant : ANDROID_KEY_PASSWORD" && exit 1)

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cuisine-pro-upload.jks"
          test -s "$RUNNER_TEMP/cuisine-pro-upload.jks"

      - name: Compiler le bundle signé pour Google Play
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/cuisine-pro-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Publier le bundle Android (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: cuisine-pro-google-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Nettoyer la clé temporaire
        if: always()
        run: rm -f "$RUNNER_TEMP/cuisine-pro-upload.jks"
