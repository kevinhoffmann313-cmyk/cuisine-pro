name: Préparer Cuisine Pro pour Google Play

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'confidentialite.html'
      - 'conditions.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  android-test:
    name: Compiler APK Android de test (sans clé de publication)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm install

      - name: Préparer les fichiers web
        run: npm run prepare:web

      - name: Générer et synchroniser le projet Android
        run: |
          npm run cap:add:android
          npm run cap:sync

      - name: Définir le SDK Android minimum à 24
        run: |
          sed -i \
            -e 's/minSdkVersion = 23/minSdkVersion = 24/' \
            -e 's/compileSdkVersion = 35/compileSdkVersion = 36/' \
            -e 's/targetSdkVersion = 35/targetSdkVersion = 36/' \
            android/variables.gradle
          grep -nE 'minSdkVersion|compileSdkVersion|targetSdkVersion' android/variables.gradle
          grep -q 'minSdkVersion = 24' android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle

      - name: Compiler APK de test
        run: cd android && ./gradlew assembleDebug

      - name: Publier l’APK de test
        uses: actions/upload-artifact@v4
        with:
          name: cuisine-pro-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-release:
    name: Compiler le bundle Android signé (.aab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Vérifier les secrets de signature
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Les secrets de signature ne sont pas encore configurés. Le build de publication est ignoré; l’APK de test reste disponible dans l’autre tâche."
          fi

      - name: Installer les dépendances
        if: steps.signing.outputs.available == 'true'
        run: npm install

      - name: Préparer les fichiers web
        if: steps.signing.outputs.available == 'true'
        run: npm run prepare:web

      - name: Générer et synchroniser le projet Android
        if: steps.signing.outputs.available == 'true'
        run: |
          npm run cap:add:android
          npm run cap:sync

      - name: Définir le SDK Android minimum à 24
        if: steps.signing.outputs.available == 'true'
        run: |
          sed -i \
            -e 's/minSdkVersion = 23/minSdkVersion = 24/' \
            -e 's/compileSdkVersion = 35/compileSdkVersion = 36/' \
            -e 's/targetSdkVersion = 35/targetSdkVersion = 36/' \
            android/variables.gradle
          grep -nE 'minSdkVersion|compileSdkVersion|targetSdkVersion' android/variables.gradle
          grep -q 'minSdkVersion = 24' android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle

      - name: Mettre à jour le numéro et la cible Android pour Google Play
        if: steps.signing.outputs.available == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_gradle = Path("android/app/build.gradle")
          app_text = app_gradle.read_text()
          app_text, count = re.subn(r'(?m)^(\s*versionCode\s+)1(\s*(?://.*)?$)', r'\g<1>2\g<2>', app_text)
          if count != 1:
              raise SystemExit(f"Impossible de mettre versionCode à 2 (remplacements: {count})")
          app_gradle.write_text(app_text)

          variables = Path("android/variables.gradle")
          variables_text = variables.read_text()
          variables_text, count = re.subn(r'(?m)^(\s*targetSdkVersion\s*=\s*)\d+', r'\g<1>36', variables_text)
          if count < 1:
              raise SystemExit("targetSdkVersion introuvable dans android/variables.gradle")
          variables.write_text(variables_text)

          print("versionCode=2")
          print("targetSdkVersion=36")
          PY
          grep -nE 'versionCode|targetSdkVersion' android/app/build.gradle android/variables.gradle

      - name: Préparer la clé de signature
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cuisine-pro-upload.jks"
          test -s "$RUNNER_TEMP/cuisine-pro-upload.jks"

      - name: Compiler le bundle signé pour Google Play
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/cuisine-pro-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Publier le bundle Android (.aab)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cuisine-pro-google-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Nettoyer la clé temporaire
        if: always()
        run: rm -f "$RUNNER_TEMP/cuisine-pro-upload.jks"
